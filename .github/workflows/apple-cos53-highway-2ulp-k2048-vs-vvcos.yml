name: Apple COS53 Highway 2ULP K2048 vs current Highway and vvcos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-cos53-highway-2ulp-k2048-vs-vvcos.yml'
      - 'benchmark_support/apple_cos53_highway_benchmark.cpp'
      - 'benchmark_support/apple_cos53_coeff_bridge.c'
      - 'benchmark_support/apple_cos53_generate_constants.c'
      - 'benchmark_support/sine_53_coeff_source.c'
      - 'cosine53_apply_formula_conversion.py'

jobs:
  benchmark:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: macos-15
    env:
      CAND_TERMS: '1'
      CAND_DEGREE: '3'
      CAND_GRID: '2048'
      CAND_SF_K: '11'
      CAND_LUTN: '3218'
      CAND_TARGET_MAX_ULP: '2'

    steps:
      - uses: actions/checkout@v4

      - name: Require native Apple M1 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          CPU="$(sysctl -n machdep.cpu.brand_string)"
          PHYS="$(sysctl -n hw.physicalcpu)"
          LOG="$(sysctl -n hw.logicalcpu)"
          echo "CPU=$CPU physical=$PHYS logical=$LOG slot=${{ matrix.slot }}"
          [[ "$CPU" == *"Apple M1"* ]]
          test "$PHYS" -ge 2
          test "$LOG" -ge 2

      - name: Install dependencies and fetch Highway 1.4.0
        shell: bash
        run: |
          set -euo pipefail
          brew list flint >/dev/null 2>&1 || brew install flint
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          brew list gmp >/dev/null 2>&1 || brew install gmp
          git clone --depth 1 --branch 1.4.0 https://github.com/google/highway.git /tmp/highway
          git -C /tmp/highway rev-parse HEAD | tee /tmp/highway_commit.txt

      - name: Generate current 1ULP Highway constants
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/sine_53_coeff_source.c /tmp/apple_cosine53_coeff_source.c
          sed -i '' 's/#define SF_K 12/#define SF_K 8/' /tmp/apple_cosine53_coeff_source.c
          sed -i '' 's/#define SF_LUT_N ((1UL << SF_K) + 1UL)/#define SF_LUT_N 403UL/' /tmp/apple_cosine53_coeff_source.c
          python3 - <<'PY'
          from pathlib import Path
          import cosine53_apply_formula_conversion as m
          m.patch_coeff(Path('/tmp/apple_cosine53_coeff_source.c'))
          PY
          FP="$(brew --prefix flint)"; MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          clang -O2 -DNDEBUG -I/tmp -I"$FP/include" -I"$MP/include" -I"$GP/include" \
            benchmark_support/apple_cos53_coeff_bridge.c benchmark_support/apple_cos53_generate_constants.c \
            -L"$FP/lib" -L"$MP/lib" -L"$GP/lib" -lflint -lmpfr -lgmp -lm \
            -o /tmp/gen_current
          /tmp/gen_current /tmp/apple_cos53_constants.h
          test -s /tmp/apple_cos53_constants.h
          shasum -a 256 /tmp/apple_cos53_constants.h | tee /tmp/current_constants.sha256

      - name: Stage exact earlier 2ULP math on Highway
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/sine_53_coeff_source.c /tmp/apple_cosine53_coeff_source_t1.c
          cp benchmark_support/apple_cos53_coeff_bridge.c /tmp/apple_cos53_coeff_bridge_t1.c
          cp benchmark_support/apple_cos53_generate_constants.c /tmp/apple_cos53_generate_constants_t1.c
          cp benchmark_support/apple_cos53_highway_benchmark.cpp /tmp/apple_cos53_highway_2ulp.cpp

          python3 - <<'PY'
          from pathlib import Path
          import os

          sfk=int(os.environ['CAND_SF_K']); lutn=int(os.environ['CAND_LUTN'])
          grid=int(os.environ['CAND_GRID']); terms=int(os.environ['CAND_TERMS']); degree=int(os.environ['CAND_DEGREE'])

          p=Path('/tmp/apple_cosine53_coeff_source_t1.c')
          s=p.read_text()
          assert '#define SF_K 12' in s
          assert '#define SF_LUT_N ((1UL << SF_K) + 1UL)' in s
          s=s.replace('#define SF_K 12',f'#define SF_K {sfk}')
          s=s.replace('#define SF_LUT_N ((1UL << SF_K) + 1UL)',f'#define SF_LUT_N {lutn}UL')
          p.write_text(s)

          p=Path('/tmp/apple_cos53_coeff_bridge_t1.c')
          s=p.read_text().replace('#include "apple_cosine53_coeff_source.c"','#include "apple_cosine53_coeff_source_t1.c"')
          assert 's53_coeff_create_terms(2)' in s and 'c->poly_deg != 5' in s
          s=s.replace('s53_coeff_create_terms(2)',f's53_coeff_create_terms({terms})')
          s=s.replace('c->poly_deg != 5',f'c->poly_deg != {degree}')
          p.write_text(s)

          p=Path('/tmp/apple_cos53_generate_constants_t1.c')
          s=p.read_text()
          assert '#define LUTN 403' in s
          s=s.replace('#define LUTN 403',f'#define LUTN {lutn}')
          p.write_text(s)

          p=Path('/tmp/apple_cos53_highway_2ulp.cpp')
          s=p.read_text()
          assert '#include "apple_cos53_constants.h"' in s
          assert 'static constexpr double KGRID = 256.0;' in s
          assert 'static constexpr double INVK = 1.0 / 256.0;' in s
          s=s.replace('#include "apple_cos53_constants.h"','#include "apple_cos53_constants_2ulp.h"')
          s=s.replace('static constexpr double KGRID = 256.0;',f'static constexpr double KGRID = {grid}.0;')
          s=s.replace('static constexpr double INVK = 1.0 / 256.0;',f'static constexpr double INVK = 1.0 / {grid}.0;')
          s=s.replace('    const auto c24v = hn::Set(d, 1.0/24.0);\n    const auto c120v = hn::Set(d, 1.0/120.0);\n','')
          old='''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n        auto c4 = hn::Mul(c0, c24v);\n        auto c5 = hn::Mul(c1, c120v);\n\n        auto p = hn::MulAdd(c5, delta, c4);\n        p = hn::MulAdd(p, delta, c3);\n        p = hn::MulAdd(p, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);'''
          new='''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n\n        auto p = hn::MulAdd(c3, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import cosine53_apply_formula_conversion as m
          m.patch_coeff(Path('/tmp/apple_cosine53_coeff_source_t1.c'))
          PY

          echo "candidate terms=$CAND_TERMS degree=$CAND_DEGREE grid=$CAND_GRID sf_k=$CAND_SF_K lutn=$CAND_LUTN target_max_ulp=$CAND_TARGET_MAX_ULP"

      - name: Generate 2ULP candidate constants
        shell: bash
        run: |
          set -euo pipefail
          FP="$(brew --prefix flint)"; MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          clang -O2 -DNDEBUG -I/tmp -I"$FP/include" -I"$MP/include" -I"$GP/include" \
            /tmp/apple_cos53_coeff_bridge_t1.c /tmp/apple_cos53_generate_constants_t1.c \
            -L"$FP/lib" -L"$MP/lib" -L"$GP/lib" -lflint -lmpfr -lgmp -lm \
            -o /tmp/gen_2ulp
          /tmp/gen_2ulp /tmp/apple_cos53_constants_2ulp.h
          test -s /tmp/apple_cos53_constants_2ulp.h
          grep -E '^#define APPLE_COS53_(LUTN|REDN)' /tmp/apple_cos53_constants_2ulp.h
          shasum -a 256 /tmp/apple_cos53_constants_2ulp.h | tee /tmp/candidate_constants.sha256

      - name: Build current and 2ULP Highway binaries and validators
        shell: bash
        run: |
          set -euo pipefail
          MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          COMMON='-O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off'
          clang++ $COMMON -I/tmp -I/tmp/highway benchmark_support/apple_cos53_highway_benchmark.cpp \
            -framework Accelerate -pthread -o /tmp/hwy_current
          clang++ $COMMON -I/tmp -I/tmp/highway /tmp/apple_cos53_highway_2ulp.cpp \
            -framework Accelerate -pthread -o /tmp/hwy_2ulp
          clang++ $COMMON -DAPPLE_COS53_VALIDATE_MPFR -I/tmp -I/tmp/highway -I"$MP/include" -I"$GP/include" \
            benchmark_support/apple_cos53_highway_benchmark.cpp \
            -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/hwy_current_validate
          clang++ $COMMON -DAPPLE_COS53_VALIDATE_MPFR -I/tmp -I/tmp/highway -I"$MP/include" -I"$GP/include" \
            /tmp/apple_cos53_highway_2ulp.cpp \
            -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/hwy_2ulp_validate

      - name: Validate both Highway variants against MPFR256
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR=/tmp/apple-cos53-highway-2ulp-result
          mkdir -p "$OUTDIR"
          /tmp/hwy_current_validate validate | tee "$OUTDIR/accuracy_current.txt"
          /tmp/hwy_2ulp_validate validate | tee "$OUTDIR/accuracy_2ulp.txt"
          MAXULP="$(sed -n 's/.*hwy_maxulp=\([0-9][0-9]*\).*/\1/p' "$OUTDIR/accuracy_2ulp.txt" | tail -1)"
          test -n "$MAXULP"
          echo "$MAXULP" | tee "$OUTDIR/candidate_maxulp.txt"
          test "$MAXULP" -le "$CAND_TARGET_MAX_ULP"

      - name: Benchmark 2ULP Highway vs current Highway vs vvcos
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR=/tmp/apple-cos53-highway-2ulp-result
          OUT="$OUTDIR/results.txt"
          : > "$OUT"
          echo "APPLE_ENV cpu=$(sysctl -n machdep.cpu.brand_string) physical=$(sysctl -n hw.physicalcpu) logical=$(sysctl -n hw.logicalcpu) arch=$(uname -m) os=$(sw_vers -productVersion) compiler='$(clang++ --version | head -1)' comparator=Accelerate_vForce_vvcos current=Highway_1.4.0_terms2_degree5_K256 candidate=Highway_1.4.0_terms1_degree3_K2048_lutn3218 helper=AppleTwoCore target_max_ulp=$CAND_TARGET_MAX_ULP" | tee -a "$OUT"
          sizes=(100 400 1200 3000 5000 20000 50000 200000)
          for n in "${sizes[@]}"; do
            case $((n % 3)) in
              0) order=(apple current cand) ;;
              1) order=(current cand apple) ;;
              2) order=(cand apple current) ;;
            esac
            for s in "${order[@]}"; do
              case "$s" in
                apple) /tmp/hwy_2ulp apple "$n" | sed 's/stack=apple/stack=vvcos/' | tee -a "$OUT" ;;
                current) /tmp/hwy_current hwy2 "$n" | sed 's/stack=hwy2/stack=highway_1ulp/' | tee -a "$OUT" ;;
                cand) /tmp/hwy_2ulp hwy2 "$n" | sed 's/stack=hwy2/stack=highway_2ulp/' | tee -a "$OUT" ;;
              esac
            done
          done
          cp /tmp/current_constants.sha256 "$OUTDIR/current_constants.sha256"
          cp /tmp/candidate_constants.sha256 "$OUTDIR/candidate_constants.sha256"
          cp /tmp/highway_commit.txt "$OUTDIR/highway_commit.txt"
          printf 'terms=1\ndegree=3\ngrid=2048\nsf_k=11\nlutn=3218\ntarget_max_ulp=2\n' > "$OUTDIR/candidate_config.txt"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-highway-2ulp-k2048-${{ matrix.slot }}
          path: /tmp/apple-cos53-highway-2ulp-result
          if-no-files-found: error
