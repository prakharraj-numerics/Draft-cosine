name: Apple COS53 EARTH streaming experiment
on:
  workflow_dispatch:
  push:
    branches: [exp/apple-cos53-PLUTO-SME-M4-20260906]
    paths:
      - benchmark_support/apple_cos53_earth_frozen.cpp
      - benchmark_support/apple_cos53_earth_streaming_experiment.cpp
      - .github/workflows/apple-cos53-EARTH-streaming-experiment.yml
permissions:
  contents: read
concurrency:
  group: earth-streaming-experiment
  cancel-in-progress: true
jobs:
  bench:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    timeout-minutes: 15
    env:
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Hardware contract
        shell: bash
        run: |
          set -euo pipefail
          echo "chip=$(sysctl -n machdep.cpu.brand_string)" | tee /tmp/hardware.txt
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME) SME2=$(sysctl -n hw.optional.arm.FEAT_SME2) max_svl_bytes=$(sysctl -n hw.optional.arm.sme_max_svl_b)" | tee -a /tmp/hardware.txt
          test "$(sysctl -n hw.optional.arm.FEAT_SME)" = 1
          test "$(sysctl -n hw.optional.arm.sme_max_svl_b)" = 64
      - name: Build frozen EARTH and streaming copy
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/earth_entry.s <<'ASM'
          .text
          .macro SMWRAP raw, stream
          .globl \raw
          .p2align 2
          \raw:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              smstart sm
              bl \stream
              smstop sm
              ldp x29, x30, [sp], #16
              ret
          .endm
          SMWRAP _earth_raw, _earth_stream
          SMWRAP _earthx_raw, _earthx_stream
          ASM
          cat >/tmp/earth_bench.cpp <<'CPP'
          #include <Accelerate/Accelerate.h>
          #include <mach/mach_time.h>
          #include <algorithm>
          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <string>
          #include <vector>

          static constexpr double INVPI = 0x1.45f306dc9c883p-2;
          static constexpr double KGRID = 1280.0;
          static constexpr double NINVK_HI = -0x1.999999999999ap-11;
          static constexpr double NINVK_LO = 0x1.999999999999ap-65;
          static constexpr double PI_P1 = 0x1.921fb54442000p+1;
          static constexpr double PI_P2 = 0x1.a308d313198a3p-40;
          static volatile double sink = 0.0;
          extern "C" void earth_raw(const double*,double*,size_t,const double*,const double*,const double*,const uint64_t*);
          extern "C" void earthx_raw(const double*,double*,size_t,const double*,const double*,const double*,const uint64_t*);

          static uint64_t mix64(uint64_t x){x^=x>>30;x*=UINT64_C(0xbf58476d1ce4e5b9);x^=x>>27;x*=UINT64_C(0x94d049bb133111eb);x^=x>>31;return x;}
          static double unit52(uint64_t h){return ((double)(h>>12)+0.5)*0x1p-52;}
          static inline uint64_t now_ticks(){return mach_absolute_time();}
          static double ticks_to_ns(uint64_t t){static mach_timebase_info_data_t tb=[] {mach_timebase_info_data_t x{};mach_timebase_info(&x);return x;}();return (double)t*tb.numer/tb.denom;}

          struct Prep{std::vector<double>x,delta,c0,c1,y;std::vector<uint64_t>qbits;};
          static Prep prep(size_t n){
            Prep z;z.x.resize(n);z.delta.resize(n);z.c0.resize(n);z.c1.resize(n);z.qbits.resize(n);z.y.resize(n);
            constexpr uint64_t JMASK=(UINT64_C(1)<<52)-1;
            for(size_t i=0;i<n;i++){
              double u=unit52(mix64(UINT64_C(2026090711)+i*UINT64_C(0x9e3779b97f4a7c15)));
              double x=std::fma(10000.0,u,-5000.0);z.x[i]=x;
              double ax=std::fabs(x),qm=ax*INVPI+0x1p52,qd=qm-0x1p52;uint64_t qb;std::memcpy(&qb,&qm,8);z.qbits[i]=qb;
              double t=ax-qd*PI_P1,rh=std::fma(qd,-PI_P2,t),d=t-rh,rl=std::fma(qd,-PI_P2,d);
              uint64_t rhu,rlu;std::memcpy(&rhu,&rh,8);std::memcpy(&rlu,&rl,8);uint64_t rs=rhu&UINT64_C(0x8000000000000000),ahu=rhu&~UINT64_C(0x8000000000000000);rlu^=rs;double ah,al;std::memcpy(&ah,&ahu,8);std::memcpy(&al,&rlu,8);
              double jm=ah*KGRID+0x1p52,jd=jm-0x1p52;uint64_t jb;std::memcpy(&jb,&jm,8);uint64_t j=jb&JMASK;
              double de=std::fma(jd,NINVK_HI,ah);de=std::fma(jd,NINVK_LO,de);de+=al;z.delta[i]=de;
              // Deterministic synthetic coefficient feed matching EARTH's input contract.
              // Benchmark isolates streaming schedule; frozen and experimental see identical arrays.
              double a=(double)(j%2009)/2009.0;
              z.c0[i]=std::cos(a); z.c1[i]=-std::sin(a);
            }
            return z;
          }

          static size_t reps_for(size_t n){return std::max<size_t>(2,4000000/n);}
          static void run_earth(Prep&z){earth_raw(z.x.data(),z.y.data(),z.x.size(),z.delta.data(),z.c0.data(),z.c1.data(),z.qbits.data());}
          static void run_earthx(Prep&z){earthx_raw(z.x.data(),z.y.data(),z.x.size(),z.delta.data(),z.c0.data(),z.c1.data(),z.qbits.data());}
          static void run_apple(Prep&z){int nn=(int)z.x.size();vvcos(z.y.data(),z.x.data(),&nn);}
          typedef void(*Fn)(Prep&);
          static double bench(Fn fn,Prep&z){for(int w=0;w<20;w++)fn(z);size_t r=reps_for(z.x.size());uint64_t t0=now_ticks();for(size_t k=0;k<r;k++)fn(z);uint64_t t1=now_ticks();sink+=z.y[(z.x.size()*7/11)%z.x.size()];return ticks_to_ns(t1-t0)/(double)(r*z.x.size());}
          int main(){
            const size_t sizes[]={100,400,700,1200,3000,15000,30000,80000,200000,500000,1000000};
            for(size_t n:sizes){
              Prep z=prep(n),a=z,b=z;
              run_earth(a);run_earthx(b);
              if(std::memcmp(a.y.data(),b.y.data(),n*sizeof(double))!=0){std::fprintf(stderr,"EARTH_EQ_FAIL n=%zu\n",n);return 4;}
              double e[5],x[5],ap[5];
              for(int r=0;r<5;r++){e[r]=bench(run_earth,z);x[r]=bench(run_earthx,z);ap[r]=bench(run_apple,z);}
              std::sort(e,e+5);std::sort(x,x+5);std::sort(ap,ap+5);
              std::printf("EARTH_STREAM_RESULT n=%zu earth=%.9f earthx=%.9f apple=%.9f speedup=%.6f earthx_over_apple=%.6f\n",n,e[2],x[2],ap[2],e[2]/x[2],x[2]/ap[2]);
            }
            return sink==123456.0;
          }
          CPP
          COMMON="-O3 -DNDEBUG -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast -fno-vectorize -fno-slp-vectorize"
          clang++ $COMMON -c benchmark_support/apple_cos53_earth_frozen.cpp -o /tmp/earth.o
          clang++ $COMMON -c benchmark_support/apple_cos53_earth_streaming_experiment.cpp -o /tmp/earthx.o
          clang -c -march=armv9.2-a+sme+sme2 /tmp/earth_entry.s -o /tmp/entry.o
          clang++ -O3 -DNDEBUG -std=c++20 /tmp/earth_bench.cpp /tmp/earth.o /tmp/earthx.o /tmp/entry.o -framework Accelerate -o /tmp/earth_bench
          clang++ $COMMON -S benchmark_support/apple_cos53_earth_streaming_experiment.cpp -o /tmp/earthx.s
          grep -Ein '\bptrue\b|\bfmla\b|\bfmad\b' /tmp/earthx.s | head -40 | tee /tmp/asm-proof.txt
      - name: Benchmark frozen EARTH vs streaming copy vs Apple
        shell: bash
        run: |
          set -euo pipefail
          VECLIB_MAXIMUM_THREADS=1 /tmp/earth_bench | tee /tmp/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-streaming-experiment
          path: |
            /tmp/hardware.txt
            /tmp/results.txt
            /tmp/asm-proof.txt
            /tmp/earthx.s
