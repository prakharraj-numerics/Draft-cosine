name: Apple COS53 EARTH streaming experiment
on:
  workflow_dispatch:
  push:
    branches: [exp/apple-cos53-PLUTO-SME-M4-20260906]
    paths:
      - benchmark_support/apple_cos53_earth_streaming_experiment.cpp
      - benchmark_support/patch_pluto_sme_streaming.py
      - benchmark_support/patch_pluto_sme_abcde_diag.py
      - .github/workflows/apple-cos53-EARTH-streaming-experiment.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: earth-streaming-experiment
  cancel-in-progress: true
jobs:
  bench:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    timeout-minutes: 15
    env:
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Hardware contract
        shell: bash
        run: |
          set -euo pipefail
          echo "chip=$(sysctl -n machdep.cpu.brand_string)" | tee /tmp/hardware.txt
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME) SME2=$(sysctl -n hw.optional.arm.FEAT_SME2) max_svl_bytes=$(sysctl -n hw.optional.arm.sme_max_svl_b)" | tee -a /tmp/hardware.txt
          test "$(sysctl -n hw.optional.arm.FEAT_SME)" = 1
          test "$(sysctl -n hw.optional.arm.sme_max_svl_b)" = 64
      - name: Fetch frozen PLUTO coefficients
        uses: actions/download-artifact@v4
        with:
          name: pluto-m4-generated-source
          path: /tmp/pluto-art
          github-token: ${{ github.token }}
          repository: prakharraj-numerics/Draft-cosine
          run-id: 34051479551
      - name: Build through proven A-E C ABI harness
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/apple_cos53_pluto_sme_m4.cpp /tmp/pluto_diag.cpp
          python3 benchmark_support/patch_pluto_sme_streaming.py /tmp/pluto_diag.cpp
          python3 benchmark_support/patch_pluto_sme_abcde_diag.py /tmp/pluto_diag.cpp
          cat >/tmp/earth_entry.s <<'ASM'
          .text
          .macro SMWRAP raw, stream
          .globl \raw
          .p2align 2
          \raw:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              smstart sm
              bl \stream
              smstop sm
              ldp x29, x30, [sp], #16
              ret
          .endm
          SMWRAP _pluto_sme_eval_raw, _pluto_sme_stream
          SMWRAP _pluto_diag_B_raw, _pluto_diag_B_stream
          SMWRAP _pluto_diag_C_raw, _pluto_diag_C_stream
          SMWRAP _pluto_diag_D_raw, _pluto_diag_D_stream
          SMWRAP _pluto_diag_E64_raw, _pluto_diag_E64_stream
          SMWRAP _pluto_diag_E128_raw, _pluto_diag_E128_stream
          SMWRAP _earthx_raw, _earthx_stream
          ASM
          cat >/tmp/earth_bench.cpp <<'CPP'
          #include <Accelerate/Accelerate.h>
          #include <mach/mach_time.h>
          #include <algorithm>
          #include <cmath>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <vector>
          static volatile double sink=0.0;
          extern "C" void pluto_diag_C_raw(const double*,double*,size_t,const double*,const double*,const double*,const uint64_t*);
          extern "C" void earthx_raw(const double*,double*,size_t,const double*,const double*,const double*,const uint64_t*);
          static uint64_t mix64(uint64_t x){x^=x>>30;x*=UINT64_C(0xbf58476d1ce4e5b9);x^=x>>27;x*=UINT64_C(0x94d049bb133111eb);x^=x>>31;return x;}
          static double unit52(uint64_t h){return ((double)(h>>12)+0.5)*0x1p-52;}
          static double ns(uint64_t t){static mach_timebase_info_data_t tb=[](){mach_timebase_info_data_t x{};mach_timebase_info(&x);return x;}();return (double)t*tb.numer/tb.denom;}
          struct P{std::vector<double>x,d,c0,c1,y;std::vector<uint64_t>q;};
          static P prep(size_t n){P z;z.x.resize(n);z.d.resize(n);z.c0.resize(n);z.c1.resize(n);z.q.resize(n);z.y.resize(n);for(size_t i=0;i<n;i++){double u=unit52(mix64(2026090711ULL+i*0x9e3779b97f4a7c15ULL));z.x[i]=10000*u-5000;z.d[i]=(unit52(mix64(i+11))-0.5)*0x1p-10;double a=unit52(mix64(i+23))*1.57;z.c0[i]=cos(a);z.c1[i]=-sin(a);double qm=fabs(z.x[i])*0x1.45f306dc9c883p-2+0x1p52;memcpy(&z.q[i],&qm,8);}return z;}
          static void earth(P&z){pluto_diag_C_raw(z.x.data(),z.y.data(),z.x.size(),z.d.data(),z.c0.data(),z.c1.data(),z.q.data());}
          static void earthx(P&z){earthx_raw(z.x.data(),z.y.data(),z.x.size(),z.d.data(),z.c0.data(),z.c1.data(),z.q.data());}
          static void apple(P&z){int n=(int)z.x.size();vvcos(z.y.data(),z.x.data(),&n);}
          using F=void(*)(P&);static double bench(F f,P&z){for(int i=0;i<20;i++)f(z);size_t r=std::max<size_t>(2,4000000/z.x.size());auto t0=mach_absolute_time();for(size_t i=0;i<r;i++)f(z);auto t1=mach_absolute_time();sink+=z.y[z.x.size()/3];return ns(t1-t0)/(r*z.x.size());}
          int main(){size_t sizes[]={100,400,700,1200,3000,15000,30000,80000,200000,500000,1000000};for(auto n:sizes){P z=prep(n),a=z,b=z;earth(a);earthx(b);if(memcmp(a.y.data(),b.y.data(),n*8)){fprintf(stderr,"EARTH_EQ_FAIL n=%zu\n",n);return 4;}double e[5],x[5],ap[5];for(int r=0;r<5;r++){e[r]=bench(earth,z);x[r]=bench(earthx,z);ap[r]=bench(apple,z);}std::sort(e,e+5);std::sort(x,x+5);std::sort(ap,ap+5);printf("EARTH_STREAM_RESULT n=%zu earth=%.9f earthx=%.9f apple=%.9f speedup=%.6f earthx_over_apple=%.6f\n",n,e[2],x[2],ap[2],e[2]/x[2],x[2]/ap[2]);}return sink==123456.0;}
          CPP
          COMMON="-O3 -DNDEBUG -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast -fno-vectorize -fno-slp-vectorize"
          clang++ $COMMON -Dmain=diag_unused_main -I/tmp/pluto-art -c /tmp/pluto_diag.cpp -o /tmp/pluto_diag.o
          clang++ $COMMON -c benchmark_support/apple_cos53_earth_streaming_experiment.cpp -o /tmp/earthx.o
          clang -c -march=armv9.2-a+sme+sme2 /tmp/earth_entry.s -o /tmp/entry.o
          clang++ -O3 -DNDEBUG -std=c++20 /tmp/earth_bench.cpp /tmp/pluto_diag.o /tmp/earthx.o /tmp/entry.o -framework Accelerate -pthread -o /tmp/earth_bench
          clang++ $COMMON -S benchmark_support/apple_cos53_earth_streaming_experiment.cpp -o /tmp/earthx.s
          grep -Ein '\bptrue\b|\bfmla\b|\bfmad\b' /tmp/earthx.s | head -40 | tee /tmp/asm-proof.txt
      - name: Benchmark proven EARTH C vs streaming copy vs Apple
        shell: bash
        run: |
          set -euo pipefail
          /tmp/earth_bench | tee /tmp/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-streaming-experiment
          path: |
            /tmp/hardware.txt
            /tmp/results.txt
            /tmp/asm-proof.txt
            /tmp/earthx.s
