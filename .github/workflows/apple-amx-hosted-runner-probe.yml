name: Apple direct AMX hosted runner probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-amx-hosted-runner-probe.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe AMX SET/CLR
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/amx_probe.c <<'C'
          #include <stdint.h>
          #include <stdio.h>
          #define AMX_NOP_OP_IMM5(op, imm5) \
            __asm("nop\nnop\nnop\n.word (0x201000 + (%0 << 5) + %1)" : : "i"(op), "i"(imm5) : "memory")
          #define AMX_SET() AMX_NOP_OP_IMM5(17,0)
          #define AMX_CLR() AMX_NOP_OP_IMM5(17,1)
          int main(void) {
            AMX_SET();
            AMX_CLR();
            puts("AMX_PROBE_OK");
            return 0;
          }
          C
          clang -O2 /tmp/amx_probe.c -o /tmp/amx_probe
          echo "arch=$(uname -m) cpu=$(sysctl -n machdep.cpu.brand_string) os=$(sw_vers -productVersion)"
          /tmp/amx_probe
