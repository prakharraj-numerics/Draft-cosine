name: Apple Namespace SME execution probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-PLUTO-SME-M4-20260906
    paths:
      - .github/workflows/apple-sme-namespace-exec-probe.yml

jobs:
  probe:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    steps:
      - uses: actions/checkout@v4
      - name: Probe locally-streaming ABI
        shell: bash
        run: |
          set -u
          echo "BRAND=$(sysctl -n machdep.cpu.brand_string)"
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME) SME2=$(sysctl -n hw.optional.arm.FEAT_SME2) SVL=$(sysctl -n hw.optional.arm.sme_max_svl_b)"
          echo "SME_FA64=$(sysctl -n hw.optional.arm.FEAT_SME_FA64 2>/dev/null || echo missing)"
          echo | clang++ -dM -E -x c++ - -march=armv9.2-a+sme+sme2 | grep -E 'ARM_FEATURE_(SME|LOCALLY_STREAMING)' | sort || true

          cat >/tmp/local.cpp <<'C'
          #include <arm_sve.h>
          #include <cstdio>
          #include <cstdint>
          __arm_locally_streaming static void f(const double*a,double*b, unsigned long* lanes) {
              auto p=svptrue_b64();
              *lanes=svcntd();
              auto z=svld1_f64(p,a);
              z=svabs_f64_x(p,z);
              z=svmul_n_f64_x(p,z,2.0);
              z=svadd_n_f64_x(p,z,1.0);
              svst1_f64(p,b,z);
          }
          int main(){ double a[8]={-1,-2,-3,-4,-5,-6,-7,-8},b[8]={}; unsigned long n=0; f(a,b,&n); std::printf("LOCAL_OK lanes=%lu %.1f %.1f\n",n,b[0],b[7]); }
          C

          cat >/tmp/local_bits.cpp <<'C'
          #include <arm_sve.h>
          #include <cstdio>
          #include <cstdint>
          __arm_locally_streaming static int f(const uint64_t*a,uint64_t*b) {
              auto p=svptrue_b64();
              auto z=svld1_u64(p,a);
              z=svand_n_u64_x(p,z,0x7fffffffffffffffULL);
              z=svlsl_n_u64_x(p,z,1);
              svst1_u64(p,b,z);
              auto q=svcmpge_n_u64(p,z,14);
              return svptest_any(p,q);
          }
          int main(){ uint64_t a[8]={1,2,3,4,5,6,7,8},b[8]={}; int q=f(a,b); std::printf("LOCAL_BITS_OK %llu %llu q=%d\n",(unsigned long long)b[0],(unsigned long long)b[7],q); }
          C

          for p in local local_bits; do
            echo "--- compile $p ---"
            clang++ -O2 -std=c++20 -march=armv9.2-a+sme+sme2 /tmp/$p.cpp -o /tmp/$p || { echo "$p COMPILE_FAIL"; continue; }
            clang++ -O2 -std=c++20 -march=armv9.2-a+sme+sme2 -S /tmp/$p.cpp -o /tmp/$p.s
            echo "--- asm $p ---"
            grep -n -Ei 'smstart|smstop|cntd|ptrue|ld1d|st1d|fabs|and|lsl|cmp|ptest|fadd|fmul' /tmp/$p.s | head -120 || true
            echo "--- run $p ---"
            set +e; /tmp/$p; rc=$?; set -e
            echo "$p rc=$rc"
          done
