name: Apple COS53 baseline vs OpenMP Marl BS below30K

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-cos53-baseline-vs-openmp-marl-bs-below30k.yml'
      - 'benchmark_support/run_apple_cos53_baseline_vs_openmp_marl_bs_below30k.sh'

concurrency:
  group: apple-cos53-baseline-openmp-marl-bs-below30k
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build four variants once
        shell: bash
        run: |
          set -euo pipefail
          bash benchmark_support/run_apple_cos53_baseline_vs_openmp_marl_bs_below30k.sh build

      - name: Verify bitwise-equivalent outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          : > /tmp/out/verify.txt
          for stack in baseline openmp marl bs; do
            bash benchmark_support/run_apple_cos53_baseline_vs_openmp_marl_bs_below30k.sh verify "$stack" | tee -a /tmp/out/verify.txt
          done

      - name: Benchmark isolated scheduler processes
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/out/results.txt
          cp /tmp/out/verify.txt "$OUT"
          echo "slot=${{ matrix.slot }} cpu=$(sysctl -n machdep.cpu.brand_string)" >> "$OUT"
          echo "kernel=K2048 degree3 terms1; frozen sub30K baseline: <5K AppleTwoCoreHighway, 5K-29999 pthreadpool-condvar" >> "$OUT"
          echo "stacks=baseline,openmp,marl,bs; each timing in its own process" >> "$OUT"
          echo "marl=$(git -C /tmp/marl rev-parse HEAD) bs=$(git -C /tmp/bs-thread-pool rev-parse HEAD) pthreadpool=$(git -C /tmp/pthreadpool rev-parse HEAD)" >> "$OUT"
          sizes=(100 400 1200 3000 4999 5000 7500 10000 15000 20000 25000 29999)
          stacks=(baseline openmp marl bs)
          for r in 0 1 2; do
            for n in "${sizes[@]}"; do
              order=$(( (r + ${{ matrix.slot }}) % 4 ))
              for j in 0 1 2 3; do
                idx=$(( (j + order) % 4 ))
                stack="${stacks[$idx]}"
                bash benchmark_support/run_apple_cos53_baseline_vs_openmp_marl_bs_below30k.sh one "$stack" "$n" \
                  | sed "s/^/round=$((r+1)) /" | tee -a "$OUT"
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-baseline-openmp-marl-bs-below30k-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
