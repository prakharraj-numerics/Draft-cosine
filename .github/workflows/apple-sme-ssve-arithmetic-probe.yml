name: Apple SME SSVE arithmetic execution probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-PLUTO-SME-M4-20260906
    paths:
      - .github/workflows/apple-sme-ssve-arithmetic-probe.yml

jobs:
  probe:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    steps:
      - uses: actions/checkout@v4

      - name: Hardware
        shell: bash
        run: |
          set -euo pipefail
          sysctl -n machdep.cpu.brand_string
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME)"
          echo "SME2=$(sysctl -n hw.optional.arm.FEAT_SME2)"
          echo "SME_MAX_SVL_B=$(sysctl -n hw.optional.arm.sme_max_svl_b)"

      - name: Build raw assembly SME control
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ssve_raw.s <<'ASM'
          .text
          .globl _ssve_raw
          .p2align 2
          _ssve_raw:
              smstart sm
              ptrue p0.d
              ld1d { z0.d }, p0/z, [x0]
              ld1d { z1.d }, p0/z, [x1]
              fadd z0.d, p0/m, z0.d, z1.d
              st1d { z0.d }, p0, [x2]
              smstop sm
              ret
          ASM

          cat >/tmp/raw_main.cpp <<'CPP'
          #include <cstdio>
          extern "C" void ssve_raw(const double*,const double*,double*);
          int main(){
              alignas(64) double a[8],b[8],c[8]{};
              for(int i=0;i<8;i++){a[i]=i+0.25;b[i]=2*i+0.5;}
              ssve_raw(a,b,c);
              for(int i=0;i<8;i++) {
                  if(c[i] != a[i]+b[i]) {
                      std::printf("BAD lane=%d got=%.17g want=%.17g\n",i,c[i],a[i]+b[i]);
                      return 7;
                  }
              }
              std::printf("RAW_SSVE_OK c0=%.17g c7=%.17g\n",c[0],c[7]);
              return 0;
          }
          CPP

          clang -c -march=armv9.2-a+sme+sme2 /tmp/ssve_raw.s -o /tmp/ssve_raw.o
          clang++ -O2 -std=c++20 -mcpu=native -fno-vectorize -fno-slp-vectorize /tmp/raw_main.cpp /tmp/ssve_raw.o -o /tmp/ssve_raw_probe
          echo '--- raw disassembly ---'
          otool -tvV /tmp/ssve_raw_probe | grep -A12 -B2 -E 'ssve_raw|smstart|ptrue|ld1d|fadd|st1d|smstop' || true

      - name: Execute raw SMSTART plus SSVE arithmetic
        shell: bash
        run: |
          set -euo pipefail
          /tmp/ssve_raw_probe
