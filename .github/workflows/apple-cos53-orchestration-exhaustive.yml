name: Apple COS53 22K 25K GCD vs Apple
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apple-cos53-orchestration-exhaustive.yml']
jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {slot: [1,2,3,4]}
    steps:
      - uses: actions/checkout@v4
      - name: Require M1 and deps
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(sysctl -n machdep.cpu.brand_string)" == *"Apple M1"* ]]
          brew list flint >/dev/null 2>&1 || brew install flint
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          brew list gmp >/dev/null 2>&1 || brew install gmp
          git clone --depth 1 --branch 1.4.0 https://github.com/google/highway.git /tmp/highway
      - name: Build frozen K2048 degree3 constants
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/sine_53_coeff_source.c /tmp/src.c
          cp benchmark_support/apple_cos53_coeff_bridge.c /tmp/bridge.c
          cp benchmark_support/apple_cos53_generate_constants.c /tmp/gen.c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src.c'); s=p.read_text().replace('#define SF_K 12','#define SF_K 11').replace('#define SF_LUT_N ((1UL << SF_K) + 1UL)','#define SF_LUT_N 3218UL'); p.write_text(s)
          p=Path('/tmp/bridge.c'); s=p.read_text().replace('#include "apple_cosine53_coeff_source.c"','#include "src.c"').replace('s53_coeff_create_terms(2)','s53_coeff_create_terms(1)').replace('c->poly_deg != 5','c->poly_deg != 3'); p.write_text(s)
          p=Path('/tmp/gen.c'); p.write_text(p.read_text().replace('#define LUTN 403','#define LUTN 3218'))
          import cosine53_apply_formula_conversion as m; m.patch_coeff(Path('/tmp/src.c'))
          PY
          FP="$(brew --prefix flint)"; MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          clang -O2 -DNDEBUG -I/tmp -I$FP/include -I$MP/include -I$GP/include /tmp/bridge.c /tmp/gen.c -L$FP/lib -L$MP/lib -L$GP/lib -lflint -lmpfr -lgmp -lm -o /tmp/gen
          /tmp/gen /tmp/apple_cos53_constants_2ulp.h
      - name: Generate benchmark
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/apple_cos53_highway_benchmark.cpp /tmp/orch.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/orch.cpp'); s=p.read_text()
          s=s.replace('#include "apple_cos53_constants.h"','#include "apple_cos53_constants_2ulp.h"')
          s=s.replace('static constexpr double KGRID = 256.0;','static constexpr double KGRID = 2048.0;').replace('static constexpr double INVK = 1.0 / 256.0;','static constexpr double INVK = 1.0 / 2048.0;')
          s=s.replace('    const auto c24v = hn::Set(d, 1.0/24.0);\n    const auto c120v = hn::Set(d, 1.0/120.0);\n','')
          start=s.index('        auto c2 = hn::Mul(c0, mh);'); end=s.index('        uint64_t sm0=', start)
          s=s[:start]+'''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n        auto p = hn::MulAdd(c3, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);\n\n'''+s[end:]
          s=s.replace('class AppleTwoCoreHighway {','static inline void cos53_eval_range(const double* x,double* y,size_t a,size_t b) { cos53_eval_hwy(x+a,y+a,b-a); }\n\nclass AppleTwoCoreHighway {',1)
          marker='static size_t reps_for(size_t n)'
          inject=r'''
          class GCDHighway { dispatch_queue_t q_; size_t chunk_; public:
            GCDHighway(size_t chunk,qos_class_t qos):chunk_(chunk){auto attr=dispatch_queue_attr_make_with_qos_class(DISPATCH_QUEUE_CONCURRENT,qos,0);q_=dispatch_queue_create("cos53.gcd",attr);}
            void run(const double*x,double*y,size_t n){size_t m=(n+chunk_-1)/chunk_;dispatch_apply(m,q_,^(size_t j){size_t a=j*chunk_,b=std::min(n,a+chunk_);cos53_eval_range(x,y,a,b);});}
          };
          static void run_gcd(GCDHighway &g,Buffers &b){for(int c=0;c<6;c++)g.run(b.x[c],b.y[c],b.n);}
          '''
          s=s.replace(marker,inject+'\n'+marker,1)
          old='''    AppleTwoCoreHighway *tc = stack=="hwy2" ? new AppleTwoCoreHighway() : nullptr;\n    auto once=[&]{ if(stack=="apple")run_apple(b); else run_hwy2(*tc,b); };'''
          new='''    AppleTwoCoreHighway *tc = stack=="hwy2" ? new AppleTwoCoreHighway() : nullptr;\n    GCDHighway *g=nullptr;\n    if(stack.rfind("gcd_ui_",0)==0) g=new GCDHighway(std::stoull(stack.substr(7)),QOS_CLASS_USER_INTERACTIVE);\n    if(stack.rfind("gcd_init_",0)==0) g=new GCDHighway(std::stoull(stack.substr(9)),QOS_CLASS_USER_INITIATED);\n    auto once=[&]{ if(stack=="apple")run_apple(b); else if(stack=="hwy2")run_hwy2(*tc,b); else run_gcd(*g,b); };'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('    delete tc;\n    return 0;','    delete tc; delete g;\n    return 0;',1)
          old_guard='if(stack!="hwy2" && stack!="apple") return 3;'
          new_guard='if(stack!="hwy2" && stack!="apple" && stack.rfind("gcd_ui_",0)!=0 && stack.rfind("gcd_init_",0)!=0) return 3;'
          assert old_guard in s; s=s.replace(old_guard,new_guard,1)
          p.write_text(s)
          PY
          clang++ -O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off -fblocks -I/tmp -I/tmp/highway /tmp/orch.cpp -framework Accelerate -pthread -o /tmp/orch
      - name: Benchmark 22K and 25K only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out; OUT=/tmp/out/results.txt
          echo "slot=${{ matrix.slot }} cpu=$(sysctl -n machdep.cpu.brand_string)" > "$OUT"
          # Confirm crossover using the 30K winner plus UI-256 as the close alternative.
          sizes=(22000 25000)
          modes=(apple gcd_init_256 gcd_ui_256)
          for r in 1 2 3 4 5; do
            for n in "${sizes[@]}"; do
              for mode in "${modes[@]}"; do /tmp/orch "$mode" "$n" | tee -a "$OUT"; done
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-22k-25k-${{ matrix.slot }}
          path: /tmp/out
