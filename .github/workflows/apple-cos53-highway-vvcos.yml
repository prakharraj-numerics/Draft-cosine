name: Apple COS53 Highway helper vs vvcos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmark_support/apple_cos53_highway_benchmark.cpp'
      - '.github/workflows/apple-cos53-highway-vvcos.yml'

jobs:
  benchmark:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require native Apple M1 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          CPU="$(sysctl -n machdep.cpu.brand_string)"
          PHYS="$(sysctl -n hw.physicalcpu)"
          LOG="$(sysctl -n hw.logicalcpu)"
          echo "CPU=$CPU physical=$PHYS logical=$LOG slot=${{ matrix.slot }}"
          [[ "$CPU" == *"Apple M1"* ]]
          test "$PHYS" -ge 2
          test "$LOG" -ge 2

      - name: Install coefficient-generation dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list flint >/dev/null 2>&1 || brew install flint
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          brew list gmp >/dev/null 2>&1 || brew install gmp

      - name: Fetch Google Highway 1.4.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.4.0 https://github.com/google/highway.git /tmp/highway
          echo "HIGHWAY_VERSION=$(git -C /tmp/highway describe --tags --always)"

      - name: Generate current Apple production-formula constants
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/sine_53_coeff_source.c /tmp/apple_cosine53_coeff_source.c
          sed -i '' 's/#define SF_K 12/#define SF_K 8/' /tmp/apple_cosine53_coeff_source.c
          sed -i '' 's/#define SF_LUT_N ((1UL << SF_K) + 1UL)/#define SF_LUT_N 403UL/' /tmp/apple_cosine53_coeff_source.c
          python3 - <<'PY'
          from pathlib import Path
          import cosine53_apply_formula_conversion as m
          m.patch_coeff(Path('/tmp/apple_cosine53_coeff_source.c'))
          PY
          FP="$(brew --prefix flint)"
          MP="$(brew --prefix mpfr)"
          GP="$(brew --prefix gmp)"
          clang -O2 -DNDEBUG -I/tmp -I"$FP/include" -I"$MP/include" -I"$GP/include" \
            benchmark_support/apple_cos53_coeff_bridge.c \
            benchmark_support/apple_cos53_generate_constants.c \
            -L"$FP/lib" -L"$MP/lib" -L"$GP/lib" -lflint -lmpfr -lgmp -lm \
            -o /tmp/apple_cos53_generate_constants
          /tmp/apple_cos53_generate_constants /tmp/apple_cos53_constants.h
          test -s /tmp/apple_cos53_constants.h
          shasum -a 256 /tmp/apple_cos53_constants.h | tee /tmp/constants.sha256

      - name: Build current Apple helper baseline and Highway helper
        shell: bash
        run: |
          set -euo pipefail
          MP="$(brew --prefix mpfr)"
          GP="$(brew --prefix gmp)"
          COMMON='-O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off'
          clang++ $COMMON -I/tmp benchmark_support/apple_cos53_benchmark.cpp \
            -framework Accelerate -pthread -o /tmp/apple_cos53_base
          clang++ $COMMON -I/tmp -I/tmp/highway benchmark_support/apple_cos53_highway_benchmark.cpp \
            -framework Accelerate -pthread -o /tmp/apple_cos53_hwy
          clang++ $COMMON -DAPPLE_COS53_VALIDATE_MPFR -I/tmp -I/tmp/highway -I"$MP/include" -I"$GP/include" \
            benchmark_support/apple_cos53_highway_benchmark.cpp \
            -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp \
            -o /tmp/apple_cos53_hwy_validate

      - name: Validate Highway accuracy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apple-cos53-highway-result
          /tmp/apple_cos53_hwy_validate validate | tee /tmp/apple-cos53-highway-result/accuracy.txt

      - name: Benchmark current helper vs Highway helper vs vvcos
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/apple-cos53-highway-result/results.txt
          : > "$OUT"
          echo "APPLE_ENV cpu=$(sysctl -n machdep.cpu.brand_string) physical=$(sysctl -n hw.physicalcpu) logical=$(sysctl -n hw.logicalcpu) arch=$(uname -m) os=$(sw_vers -productVersion) compiler='$(clang++ --version | head -1)' comparator=Accelerate_vForce_vvcos baseline=current_NEON_AppleTwoCore candidate=Google_Highway_1.4.0_same_AppleTwoCore_helper" | tee -a "$OUT"
          sizes=(100 400 1200 3000 5000 20000 50000 200000)
          for n in "${sizes[@]}"; do
            case $((n % 3)) in
              0) order=(apple base hwy) ;;
              1) order=(base hwy apple) ;;
              2) order=(hwy apple base) ;;
            esac
            for s in "${order[@]}"; do
              case "$s" in
                apple) /tmp/apple_cos53_hwy apple "$n" | tee -a "$OUT" ;;
                base)  /tmp/apple_cos53_base ours2 "$n" | tee -a "$OUT" ;;
                hwy)   /tmp/apple_cos53_hwy hwy2 "$n" | tee -a "$OUT" ;;
              esac
            done
          done
          cp /tmp/constants.sha256 /tmp/apple-cos53-highway-result/constants.sha256
          git -C /tmp/highway rev-parse HEAD > /tmp/apple-cos53-highway-result/highway_commit.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-highway-vvcos-${{ matrix.slot }}
          path: /tmp/apple-cos53-highway-result
          if-no-files-found: error
