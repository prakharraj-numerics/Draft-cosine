name: Apple COS53 Namespace PLUTO SME A-E diagnostic
on:
  workflow_dispatch:
  push:
    branches: [exp/apple-cos53-PLUTO-SME-M4-20260906]
    paths:
      - benchmark_support/apple_cos53_pluto_sme_m4.cpp
      - benchmark_support/patch_pluto_sme_streaming.py
      - benchmark_support/patch_pluto_sme_abcde_diag.py
      - .github/workflows/apple-cos53-NAMESPACE-PLUTO-SME-benchmark.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: pluto-sme-abcde-single-run
  cancel-in-progress: true
jobs:
  bench:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    timeout-minutes: 20
    env:
      VECLIB_MAXIMUM_THREADS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Hardware contract
        shell: bash
        run: |
          set -euo pipefail
          echo "chip=$(sysctl -n machdep.cpu.brand_string)" | tee /tmp/hardware.txt
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME) SME2=$(sysctl -n hw.optional.arm.FEAT_SME2) max_svl_bytes=$(sysctl -n hw.optional.arm.sme_max_svl_b)" | tee -a /tmp/hardware.txt
          test "$(sysctl -n hw.optional.arm.FEAT_SME)" = 1
          test "$(sysctl -n hw.optional.arm.sme_max_svl_b)" = 64
          clang++ --version | head -1 | tee -a /tmp/hardware.txt
      - name: Fetch frozen PLUTO coefficients
        uses: actions/download-artifact@v4
        with:
          name: pluto-m4-generated-source
          path: /tmp/pluto-art
          github-token: ${{ github.token }}
          repository: prakharraj-numerics/Draft-cosine
          run-id: 34051479551
      - name: Build A-E diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/apple_cos53_pluto_sme_m4.cpp /tmp/pluto_diag.cpp
          python3 benchmark_support/patch_pluto_sme_streaming.py /tmp/pluto_diag.cpp
          python3 benchmark_support/patch_pluto_sme_abcde_diag.py /tmp/pluto_diag.cpp
          cat >/tmp/pluto_sme_entry.s <<'ASM'
          .text
          .macro SMWRAP raw, stream
          .globl \raw
          .p2align 2
          \raw:
              stp x29, x30, [sp, #-16]!
              mov x29, sp
              smstart sm
              bl \stream
              smstop sm
              ldp x29, x30, [sp], #16
              ret
          .endm
          SMWRAP _pluto_sme_eval_raw, _pluto_sme_stream
          SMWRAP _pluto_diag_B_raw, _pluto_diag_B_stream
          SMWRAP _pluto_diag_C_raw, _pluto_diag_C_stream
          SMWRAP _pluto_diag_D_raw, _pluto_diag_D_stream
          SMWRAP _pluto_diag_E64_raw, _pluto_diag_E64_stream
          SMWRAP _pluto_diag_E128_raw, _pluto_diag_E128_stream
          ASM
          COMMON="-O3 -DNDEBUG -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast -fno-vectorize -fno-slp-vectorize"
          clang++ $COMMON -I/tmp/pluto-art -c /tmp/pluto_diag.cpp -o /tmp/pluto_diag.o
          clang -c -march=armv9.2-a+sme+sme2 /tmp/pluto_sme_entry.s -o /tmp/pluto_sme_entry.o
          clang++ /tmp/pluto_diag.o /tmp/pluto_sme_entry.o -framework Accelerate -pthread -o /tmp/pluto_diag
          clang++ $COMMON -I/tmp/pluto-art -S /tmp/pluto_diag.cpp -o /tmp/pluto_diag.s
          grep -Ein '\bfmla\b|\bfmad\b' /tmp/pluto_diag.s | head -30 | tee /tmp/fma-proof.txt
          test -s /tmp/fma-proof.txt
      - name: Build and run accuracy gate for A E64 E128
        shell: bash
        run: |
          set -euo pipefail
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          COMMON="-O3 -DNDEBUG -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast -fno-vectorize -fno-slp-vectorize"
          clang++ $COMMON -DOPT_VALIDATE_MPFR -I/tmp/pluto-art -I"$MP/include" -I"$GP/include" -c /tmp/pluto_diag.cpp -o /tmp/pluto_validate.o
          clang++ /tmp/pluto_validate.o /tmp/pluto_sme_entry.o -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/pluto_validate
          /tmp/pluto_validate validate | tee /tmp/accuracy.txt
          python3 - <<'PY'
          import re
          s=open('/tmp/accuracy.txt').read()
          rows=re.findall(r'PLUTO_SME_ACCURACY stack=(\w+) tag=(\S+).*?maxulp=(\d+)',s)
          print('ACCURACY_ROWS',rows)
          assert rows and all(int(u)<=2 for _,_,u in rows), rows
          for st in ('sme','E64','E128'):
              assert any(a==st and tag=='9600' for a,tag,_ in rows), (st,rows)
              assert any(a==st and tag=='1m_stress' for a,tag,_ in rows), (st,rows)
          PY
      - name: A-E one-shot diagnostic benchmark
        shell: bash
        run: |
          set -euo pipefail
          sizes=(100 3000 30000 80000 200000 1000000)
          modes=(A B C D E64 E128 neon apple)
          : >/tmp/raw.txt
          for round in 1 2 3; do
            for n in "${sizes[@]}"; do
              shift=$(( (round+n) % ${#modes[@]} ))
              for ((k=0;k<${#modes[@]};k++)); do
                m=${modes[$(((k+shift)%${#modes[@]}))]}
                /tmp/pluto_diag "$m" "$n" | tee -a /tmp/raw.txt
              done
            done
          done
          python3 - <<'PY' | tee /tmp/summary.tsv
          import re,statistics
          rows={}
          for line in open('/tmp/raw.txt'):
              m=re.search(r'stack=(\w+) n=(\d+) wall_ns_el=([0-9.]+)',line)
              if m: rows.setdefault((int(m.group(2)),m.group(1)),[]).append(float(m.group(3)))
          modes=('A','B','C','D','E64','E128','neon','apple')
          print('n\t'+'\t'.join(modes))
          for n in sorted({k[0] for k in rows}):
              med={m:statistics.median(rows[(n,m)]) for m in modes}
              print(str(n)+'\t'+'\t'.join(f'{med[m]:.9f}' for m in modes))
          print('\nINTERPRETATION_RATIOS')
          for n in sorted({k[0] for k in rows}):
              med={m:statistics.median(rows[(n,m)]) for m in modes}
              print(f'n={n} A={med["A"]:.3f} B={med["B"]:.3f} C={med["C"]:.3f} D={med["D"]:.3f} E64={med["E64"]:.3f} E128={med["E128"]:.3f} apple={med["apple"]:.3f} A_over_C={med["A"]/med["C"]:.2f} D_over_C={med["D"]/med["C"]:.2f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluto-sme-abcde-diagnostic
          path: |
            /tmp/hardware.txt
            /tmp/accuracy.txt
            /tmp/raw.txt
            /tmp/summary.tsv
            /tmp/fma-proof.txt
            /tmp/pluto_diag.s
