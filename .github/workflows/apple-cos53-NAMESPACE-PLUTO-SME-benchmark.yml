name: Apple COS53 Namespace PLUTO SME exact SIGILL capture
on:
  workflow_dispatch:
  push:
    branches: [exp/apple-cos53-PLUTO-SME-M4-20260906]
    paths:
      - .github/workflows/apple-cos53-NAMESPACE-PLUTO-SME-benchmark.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: pluto-sme-single-run
  cancel-in-progress: true
jobs:
  capture:
    runs-on: nscloud-macos-tahoe-arm64-6x14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Hardware
        shell: bash
        run: |
          set -euo pipefail
          echo "chip=$(sysctl -n machdep.cpu.brand_string)"
          echo "SME=$(sysctl -n hw.optional.arm.FEAT_SME) SME2=$(sysctl -n hw.optional.arm.FEAT_SME2) F64=$(sysctl -n hw.optional.arm.FEAT_SME_F64F64) FA64=$(sysctl -n hw.optional.arm.FEAT_SME_FA64 2>/dev/null || echo 0) SVL=$(sysctl -n hw.optional.arm.sme_max_svl_b)"
      - name: Fetch coefficient table
        uses: actions/download-artifact@v4
        with:
          name: pluto-m4-generated-source
          path: /tmp/pluto-art
          github-token: ${{ github.token }}
          repository: prakharraj-numerics/Draft-cosine
          run-id: 34051479551
      - name: Build exact crashing path with SIGILL capture
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/capture.cpp <<'CPP'
          #include <arm_sve.h>
          #include <cstdint>
          #include <cstdio>
          #include <csignal>
          #include <ucontext.h>
          #include <unistd.h>
          #include "apple_cos53_coeff_aos.h"
          static void hex64(char* p, uint64_t v, int n){ static const char h[]="0123456789abcdef"; for(int i=n-1;i>=0;--i){p[i]=h[v&15];v>>=4;} }
          static void ill(int, siginfo_t*, void* vp){
            auto* uc=(ucontext_t*)vp;
            uintptr_t pc=(uintptr_t)uc->uc_mcontext->__ss.__pc;
            uint32_t insn=*(volatile uint32_t*)pc;
            char b[]="SIGILL_PC=0x0000000000000000 INSN=0x00000000\n";
            hex64(b+12,(uint64_t)pc,16); hex64(b+36,(uint64_t)insn,8);
            write(2,b,sizeof(b)-1); _exit(132);
          }
          static constexpr double INVPI=0x1.45f306dc9c883p-2,KGRID=1280.0,NINVK_HI=-0x1.999999999999ap-11,NINVK_LO=0x1.999999999999ap-65,PI_P1=0x1.921fb54442000p+1,PI_P2=0x1.a308d313198a3p-40,MH=-0x1.ffffff92c5f94p-2,M6=-0x1.5555551eb851fp-3;
          static inline void body(svbool_t pg,const double*x,double*y,uint64_t*jt,uint64_t*c0b,uint64_t*c1b){
            auto xv=svld1_f64(pg,x); auto ax=svabs_f64_x(pg,xv);
            auto qscaled=svmul_n_f64_x(pg,ax,INVPI); auto qmagic=svadd_n_f64_x(pg,qscaled,0x1p52); auto qd=svsub_n_f64_x(pg,qmagic,0x1p52); auto qbits=svreinterpret_u64_f64(qmagic);
            auto qp1=svmul_n_f64_x(pg,qd,PI_P1); auto t=svsub_f64_x(pg,ax,qp1); auto rh=svmla_n_f64_x(pg,t,qd,-PI_P2);
            auto d=svsub_f64_x(pg,t,rh); auto rl=svmla_n_f64_x(pg,d,qd,-PI_P2);
            auto sm=svdup_u64(UINT64_C(0x8000000000000000)); auto rhu=svreinterpret_u64_f64(rh); auto rs=svand_u64_x(pg,rhu,sm); auto ah=svreinterpret_f64_u64(svbic_u64_x(pg,rhu,sm)); auto al=svreinterpret_f64_u64(sveor_u64_x(pg,svreinterpret_u64_f64(rl),rs));
            auto jm=svadd_n_f64_x(pg,svmul_n_f64_x(pg,ah,KGRID),0x1p52); auto jd=svsub_n_f64_x(pg,jm,0x1p52); auto ji=svand_n_u64_x(pg,svreinterpret_u64_f64(jm),(UINT64_C(1)<<52)-1);
            auto delta=svmla_n_f64_x(pg,ah,jd,NINVK_HI); delta=svmla_n_f64_x(pg,delta,jd,NINVK_LO); delta=svadd_f64_x(pg,delta,al);
            svst1_u64(pg,jt,ji); auto bits=reinterpret_cast<const uint64_t*>(opt_cos53_coeff_aos);
            for(uint64_t l=0;l<8;l++){uint64_t j=jt[l];auto q=bits+2*j;c0b[l]=q[0];c1b[l]=q[1];}
            auto c0=svreinterpret_f64_u64(svld1_u64(pg,c0b)); auto c1=svreinterpret_f64_u64(svld1_u64(pg,c1b)); auto c2=svmul_n_f64_x(pg,c0,MH); auto c3=svmul_n_f64_x(pg,c1,M6); auto p=svmla_f64_x(pg,c2,c3,delta);p=svmla_f64_x(pg,c1,p,delta);p=svmla_f64_x(pg,c0,p,delta);auto par=svand_n_u64_x(pg,qbits,1);auto os=svlsl_n_u64_x(pg,par,63);p=svreinterpret_f64_u64(sveor_u64_x(pg,svreinterpret_u64_f64(p),os));svst1_f64(pg,y,p);
          }
          extern "C" size_t p(const double*x,double*y,size_t n,uint64_t*) __arm_streaming;
          extern "C" size_t p(const double*x,double*y,size_t n,uint64_t*) __arm_streaming {alignas(64) uint64_t jt[8],a[8],b[8];svbool_t pg=svptrue_b64();for(size_t i=0;i+8<=n;i+=8)body(pg,x+i,y+i,jt,a,b);return 0;}
          extern "C" size_t raw(const double*,double*,size_t,uint64_t*);
          int main(){ struct sigaction sa{}; sa.sa_sigaction=ill; sa.sa_flags=SA_SIGINFO; sigemptyset(&sa.sa_mask); sigaction(SIGILL,&sa,nullptr); alignas(64) double x[16],y[16]{};alignas(64) uint64_t r[16]{};for(int i=0;i<16;i++)x[i]=0.05*(i+1); raw(x,y,16,r); std::printf("NO_SIGILL y0=%.17g y15=%.17g\n",y[0],y[15]); }
          CPP
          cat >/tmp/wrap.s <<'ASM'
          .text
          .globl _raw
          .p2align 2
          _raw:
            stp x29,x30,[sp,#-16]!
            mov x29,sp
            smstart sm
            bl _p
            smstop sm
            ldp x29,x30,[sp],#16
            ret
          ASM
          C="-O3 -DNDEBUG -D_XOPEN_SOURCE=700 -std=c++20 -march=armv9.2-a+sme+sme2 -fno-fast-math -ffp-contract=fast"
          clang++ $C -I/tmp/pluto-art -c /tmp/capture.cpp -o /tmp/capture.o
          clang -c -march=armv9.2-a+sme+sme2 /tmp/wrap.s -o /tmp/wrap.o
          clang++ -Wl,-no_pie /tmp/capture.o /tmp/wrap.o -o /tmp/capture
          otool -tvV /tmp/capture > /tmp/disasm.txt
          nm -nm /tmp/capture > /tmp/nm.txt
      - name: Capture faulting PC and opcode
        shell: bash
        run: |
          set +e
          /tmp/capture 2>&1 | tee /tmp/capture.txt
          rc=${PIPESTATUS[0]}
          echo "CAPTURE_RC=$rc"
          echo "--- streaming function disassembly ---"
          awk '/<_p>:/,/^$/' /tmp/disasm.txt || true
          grep -E 'SIGILL_PC|INSN=' /tmp/capture.txt || true
          exit 0
