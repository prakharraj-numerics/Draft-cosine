name: Apple COS53 hand NEON v2 vs Highway vs vvcos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-cos53-handneon-v2-vs-highway.yml'

jobs:
  benchmark:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require native Apple M1 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          CPU="$(sysctl -n machdep.cpu.brand_string)"
          echo "CPU=$CPU slot=${{ matrix.slot }}"
          [[ "$CPU" == *"Apple M1"* ]]

      - name: Install dependencies and Highway
        shell: bash
        run: |
          set -euo pipefail
          brew list flint >/dev/null 2>&1 || brew install flint
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          brew list gmp >/dev/null 2>&1 || brew install gmp
          git clone --depth 1 --branch 1.4.0 https://github.com/google/highway.git /tmp/highway

      - name: Generate current Apple constants
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/sine_53_coeff_source.c /tmp/apple_cosine53_coeff_source.c
          sed -i '' 's/#define SF_K 12/#define SF_K 8/' /tmp/apple_cosine53_coeff_source.c
          sed -i '' 's/#define SF_LUT_N ((1UL << SF_K) + 1UL)/#define SF_LUT_N 403UL/' /tmp/apple_cosine53_coeff_source.c
          python3 - <<'PY'
          from pathlib import Path
          import cosine53_apply_formula_conversion as m
          m.patch_coeff(Path('/tmp/apple_cosine53_coeff_source.c'))
          PY
          FP="$(brew --prefix flint)"; MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          clang -O2 -DNDEBUG -I/tmp -I"$FP/include" -I"$MP/include" -I"$GP/include" \
            benchmark_support/apple_cos53_coeff_bridge.c benchmark_support/apple_cos53_generate_constants.c \
            -L"$FP/lib" -L"$MP/lib" -L"$GP/lib" -lflint -lmpfr -lgmp -lm -o /tmp/gen
          /tmp/gen /tmp/apple_cos53_constants.h

      - name: Derive hand NEON v2 from assembly findings
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/apple_cos53_handneon_benchmark.cpp /tmp/handv2.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/handv2.cpp')
          s=p.read_text()
          old='''        const float64x2_t qround = vrndnq_f64(vmulq_n_f64(ax, INVPI));\n        const int64x2_t qi = vcvtq_s64_f64(qround);'''
          new='''        // Match Highway's single FCVTNS codegen: round-to-nearest signed conversion.\n        const int64x2_t qi = vcvtnq_s64_f64(vmulq_n_f64(ax, INVPI));'''
          assert old in s
          s=s.replace(old,new)
          old2='''        int j0=(int)vgetq_lane_s64(ji,0);\n        int j1=(int)vgetq_lane_s64(ji,1);\n        if (j0<0) j0=0; else if (j0>=APPLE_COS53_LUTN) j0=APPLE_COS53_LUTN-1;\n        if (j1<0) j1=0; else if (j1>=APPLE_COS53_LUTN) j1=APPLE_COS53_LUTN-1;'''
          new2='''        // r is |x-q*pi| <= pi/2, hence round(r*256) is provably in [0,402].\n        // Avoid the redundant clamp that Clang turned into extra vector min/max work.\n        const int j0=(int)vgetq_lane_s64(ji,0);\n        const int j1=(int)vgetq_lane_s64(ji,1);'''
          assert old2 in s
          s=s.replace(old2,new2)
          p.write_text(s)
          PY

      - name: Build v2, Highway, validator, and assembly
        shell: bash
        run: |
          set -euo pipefail
          MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          COMMON='-O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off'
          clang++ $COMMON -I/tmp /tmp/handv2.cpp -framework Accelerate -pthread -o /tmp/handv2
          clang++ $COMMON -I/tmp -I/tmp/highway benchmark_support/apple_cos53_highway_benchmark.cpp -framework Accelerate -pthread -o /tmp/hwy
          clang++ $COMMON -DAPPLE_COS53_VALIDATE_MPFR -I/tmp -I"$MP/include" -I"$GP/include" /tmp/handv2.cpp \
            -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/handv2_validate
          clang++ $COMMON -S -I/tmp /tmp/handv2.cpp -o /tmp/handv2.s
          clang++ $COMMON -S -I/tmp -I/tmp/highway benchmark_support/apple_cos53_highway_benchmark.cpp -o /tmp/hwy.s
          echo 'v2 q-conversion:'
          grep -n -E 'fcvtns|frintn|fcvtzs' /tmp/handv2.s | head -20

      - name: Validate and benchmark
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR=/tmp/apple-cos53-handv2-result; mkdir -p "$OUTDIR"
          /tmp/handv2_validate validate | tee "$OUTDIR/accuracy.txt"
          OUT="$OUTDIR/results.txt"; : > "$OUT"
          echo "APPLE_ENV cpu=$(sysctl -n machdep.cpu.brand_string) os=$(sw_vers -productVersion) incumbent=Highway_1.4.0 candidate=hand_NEON_v2_single_FCVTNS_no_redundant_j_clamp comparator=vvcos" | tee -a "$OUT"
          sizes=(100 400 1200 3000 5000 20000 50000 200000)
          for n in "${sizes[@]}"; do
            case $((n % 3)) in
              0) order=(apple hwy hand) ;;
              1) order=(hwy hand apple) ;;
              2) order=(hand apple hwy) ;;
            esac
            for s in "${order[@]}"; do
              case "$s" in
                apple) /tmp/handv2 apple "$n" | tee -a "$OUT" ;;
                hwy) /tmp/hwy hwy2 "$n" | tee -a "$OUT" ;;
                hand) /tmp/handv2 hand2 "$n" | tee -a "$OUT" ;;
              esac
            done
          done
          cp /tmp/handv2.s "$OUTDIR/handv2.s"; cp /tmp/hwy.s "$OUTDIR/hwy.s"

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-handneon-v2-${{ matrix.slot }}
          path: /tmp/apple-cos53-handv2-result
          if-no-files-found: error
