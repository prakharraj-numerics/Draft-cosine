name: Apple COS53 frozen production vs Halide-integrated production vs vvcos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-cos53-prod-vs-halide-prod-vs-vvcos.yml'

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Apple M1 and install deps
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(sysctl -n machdep.cpu.brand_string)" == *"Apple M1"* ]]
          brew list flint >/dev/null 2>&1 || brew install flint
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          brew list gmp >/dev/null 2>&1 || brew install gmp
          brew list halide >/dev/null 2>&1 || brew install halide
          rm -rf /tmp/highway
          git clone --depth 1 --branch 1.4.0 https://github.com/google/highway.git /tmp/highway

      - name: Extract exact frozen Apple production state
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=aefbe778e860ef70e64fc8d6b6d470b3575f3bbc
          git show "$FREEZE":benchmark_support/apple_cos53_highway_benchmark.cpp > /tmp/base.cpp
          git show "$FREEZE":apple_cos53_production_routing.hpp > /tmp/apple_cos53_production_routing.hpp
          git show "$FREEZE":benchmark_support/sine_53_coeff_source.c > /tmp/src.c
          git show "$FREEZE":benchmark_support/apple_cos53_coeff_bridge.c > /tmp/bridge.c
          git show "$FREEZE":benchmark_support/apple_cos53_generate_constants.c > /tmp/gen.c
          git show "$FREEZE":cosine53_apply_formula_conversion.py > /tmp/cosine53_apply_formula_conversion.py

      - name: Build exact frozen K2048 degree3 constants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'/tmp')
          p=Path('/tmp/src.c')
          s=p.read_text().replace('#define SF_K 12','#define SF_K 11').replace('#define SF_LUT_N ((1UL << SF_K) + 1UL)','#define SF_LUT_N 3218UL')
          p.write_text(s)
          p=Path('/tmp/bridge.c')
          s=p.read_text().replace('#include "apple_cosine53_coeff_source.c"','#include "src.c"').replace('s53_coeff_create_terms(2)','s53_coeff_create_terms(1)').replace('c->poly_deg != 5','c->poly_deg != 3')
          p.write_text(s)
          p=Path('/tmp/gen.c')
          p.write_text(p.read_text().replace('#define LUTN 403','#define LUTN 3218'))
          import cosine53_apply_formula_conversion as m
          m.patch_coeff(Path('/tmp/src.c'))
          PY
          FP="$(brew --prefix flint)"; MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          clang -O2 -DNDEBUG -I/tmp -I$FP/include -I$MP/include -I$GP/include /tmp/bridge.c /tmp/gen.c \
            -L$FP/lib -L$MP/lib -L$GP/lib -lflint -lmpfr -lgmp -lm -o /tmp/gen
          /tmp/gen /tmp/apple_cos53_constants_2ulp.h

      - name: Build isolated frozen production plus vvcos executable
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/base.cpp /tmp/prod.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/prod.cpp'); s=p.read_text()
          s=s.replace('#include "apple_cos53_constants.h"','#include "apple_cos53_constants_2ulp.h"')
          s=s.replace('static constexpr double KGRID = 256.0;','static constexpr double KGRID = 2048.0;').replace('static constexpr double INVK = 1.0 / 256.0;','static constexpr double INVK = 1.0 / 2048.0;')
          s=s.replace('    const auto c24v = hn::Set(d, 1.0/24.0);\n    const auto c120v = hn::Set(d, 1.0/120.0);\n','')
          start=s.index('        auto c2 = hn::Mul(c0, mh);'); end=s.index('        uint64_t sm0=', start)
          s=s[:start]+'''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n        auto p = hn::MulAdd(c3, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);\n\n'''+s[end:]
          marker='static size_t reps_for(size_t n)'
          inject='''#include "apple_cos53_production_routing.hpp"\n\nstatic void run_production(AppleTwoCoreHighway &tc, Buffers &b) {\n    for(int c=0;c<6;c++) apple_cos53_production::run(tc,b.x[c],b.y[c],b.n);\n}\n'''
          s=s.replace(marker,inject+'\n'+marker,1)
          old='''    AppleTwoCoreHighway *tc = stack=="hwy2" ? new AppleTwoCoreHighway() : nullptr;\n    auto once=[&]{ if(stack=="apple")run_apple(b); else run_hwy2(*tc,b); };'''
          new='''    AppleTwoCoreHighway *tc = (stack=="hwy2" || stack=="prod") ? new AppleTwoCoreHighway() : nullptr;\n    auto once=[&]{ if(stack=="prod") run_production(*tc,b); else if(stack=="apple") run_apple(b); else run_hwy2(*tc,b); };'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('if(stack!="hwy2" && stack!="apple") return 3;','if(stack!="hwy2" && stack!="apple" && stack!="prod") return 3;',1)
          p.write_text(s)
          PY
          clang++ -O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off -fblocks \
            -I/tmp -I/tmp/highway /tmp/prod.cpp -framework Accelerate -pthread -o /tmp/prod_bench

      - name: Build isolated Halide-integrated production executable
        shell: bash
        run: |
          set -euo pipefail
          HP="$(brew --prefix halide)"
          cat >/tmp/genrt.cpp <<'CPP'
          #include <Halide.h>
          int main() {
              Halide::compile_standalone_runtime("/tmp/halide_runtime.a", Halide::get_host_target());
              return 0;
          }
          CPP
          clang++ -O2 -std=c++20 -I"$HP/include" /tmp/genrt.cpp -L"$HP/lib" -lHalide -o /tmp/genrt
          /tmp/genrt
          nm /tmp/halide_runtime.a | grep -E 'halide_do_par_for|halide_set_num_threads' >/dev/null

          cp /tmp/base.cpp /tmp/halide_prod.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/halide_prod.cpp'); s=p.read_text()
          s=s.replace('#include <vector>','#include <vector>\n#include <HalideRuntime.h>')
          s=s.replace('#include "apple_cos53_constants.h"','#include "apple_cos53_constants_2ulp.h"')
          s=s.replace('static constexpr double KGRID = 256.0;','static constexpr double KGRID = 2048.0;').replace('static constexpr double INVK = 1.0 / 256.0;','static constexpr double INVK = 1.0 / 2048.0;')
          s=s.replace('    const auto c24v = hn::Set(d, 1.0/24.0);\n    const auto c120v = hn::Set(d, 1.0/120.0);\n','')
          start=s.index('        auto c2 = hn::Mul(c0, mh);'); end=s.index('        uint64_t sm0=', start)
          s=s[:start]+'''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n        auto p = hn::MulAdd(c3, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);\n\n'''+s[end:]
          marker='static size_t reps_for(size_t n)'
          inject=r'''
          struct HalidePartCtx { const double* x; double* y; size_t n; size_t pieces; };
          static int halide_piece(void*, int j, uint8_t *closure) {
              auto *c=reinterpret_cast<HalidePartCtx*>(closure);
              size_t jj=(size_t)j;
              size_t a=(c->n*jj)/c->pieces, b=(c->n*(jj+1))/c->pieces;
              cos53_eval_hwy(c->x+a,c->y+a,b-a);
              return 0;
          }
          static void run_halide_partitioned(const double*x,double*y,size_t n,size_t pieces) {
              size_t p=std::min(pieces,n);
              HalidePartCtx c{x,y,n,p};
              int rc=halide_do_par_for(nullptr,halide_piece,0,(int)p,reinterpret_cast<uint8_t*>(&c));
              if(rc) std::abort();
          }
          static size_t frozen_pieces(size_t n) {
              if(n<30000) return 0;
              if(n<50000) return 32;
              if(n<100000) return 16;
              if(n<1000000) return 12;
              return 24;
          }
          static void run_halide_production(AppleTwoCoreHighway &tc, Buffers &b) {
              size_t pieces=frozen_pieces(b.n);
              for(int c=0;c<6;c++) {
                  if(!pieces) tc.run(b.x[c],b.y[c],b.n);
                  else run_halide_partitioned(b.x[c],b.y[c],b.n,pieces);
              }
          }
          '''
          s=s.replace(marker,inject+'\n'+marker,1)
          old='''    AppleTwoCoreHighway *tc = stack=="hwy2" ? new AppleTwoCoreHighway() : nullptr;\n    auto once=[&]{ if(stack=="apple")run_apple(b); else run_hwy2(*tc,b); };'''
          new='''    AppleTwoCoreHighway *tc = (stack=="hwy2" || stack=="halide_prod") ? new AppleTwoCoreHighway() : nullptr;\n    auto once=[&]{ if(stack=="halide_prod") run_halide_production(*tc,b); else if(stack=="apple") run_apple(b); else run_hwy2(*tc,b); };'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('if(stack!="hwy2" && stack!="apple") return 3;','if(stack!="hwy2" && stack!="apple" && stack!="halide_prod") return 3;',1)
          s=s.replace('    return bench_mode(stack,n);','    halide_set_num_threads(3);\n    return bench_mode(stack,n);',1)
          p.write_text(s)
          PY
          clang++ -O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off -fblocks \
            -I/tmp -I/tmp/highway -I"$HP/include" /tmp/halide_prod.cpp /tmp/halide_runtime.a \
            -framework Accelerate -pthread -ldl -o /tmp/halide_prod_bench

      - name: Benchmark exact production vs Halide-integrated production vs vvcos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          echo "slot=${{ matrix.slot }} cpu=$(sysctl -n machdep.cpu.brand_string)" > "$OUT"
          echo "comparison=frozen_prod_vs_same_prod_halide_scheduler_vs_apple_vvcos" >> "$OUT"
          sizes=(100 400 1200 3000 5000 20000 30000 40000 50000 75000 100000 200000 500000 1000000)
          for r in 1 2 3; do
            for n in "${sizes[@]}"; do
              /tmp/prod_bench prod "$n" | sed 's/^/PROD /' | tee -a "$OUT"
              /tmp/halide_prod_bench halide_prod "$n" | sed 's/^/HALIDE_PROD /' | tee -a "$OUT"
              /tmp/prod_bench apple "$n" | sed 's/^/VVCOS /' | tee -a "$OUT"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-prod-vs-halide-prod-vs-vvcos-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
