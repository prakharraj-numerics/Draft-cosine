name: Apple COS53 degree2 rootfix stressed 1M accuracy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-cos53-degree2-rootfix-1m-danger.yml'
      - 'benchmark_support/run_apple_cos53_degree2_rootfix_1m_danger.sh'

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run degree2 plus rootfix 1M MPFR256 validator
        shell: bash
        run: |
          set -euo pipefail
          bash benchmark_support/run_apple_cos53_degree2_rootfix_1m_danger.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-degree2-rootfix-1m-danger
          path: /tmp/degree2_rootfix_1m.txt
          if-no-files-found: error
