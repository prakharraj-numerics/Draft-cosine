name: Apple COS53 Instruments probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-instruments-3k-78k-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-instruments-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Probe Instruments and counters with deadlines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          python3 - <<'PY' | tee /tmp/out/probe.txt
          import subprocess
          cmds=[
            ('uname',['uname','-a'],10),
            ('cpu',['sysctl','-n','machdep.cpu.brand_string'],10),
            ('xcode',['xcodebuild','-version'],15),
            ('xctrace-version',['xcrun','xctrace','version'],15),
            ('templates',['xcrun','xctrace','list','templates'],30),
            ('record-help',['xcrun','xctrace','record','--help'],15),
            ('export-help',['xcrun','xctrace','export','--help'],15),
          ]
          for name,cmd,to in cmds:
              print(f'=== {name} ===', flush=True)
              try:
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=to)
                  print(p.stdout, end='')
                  print('RC',p.returncode)
              except subprocess.TimeoutExpired as e:
                  out=e.stdout.decode() if isinstance(e.stdout,bytes) else (e.stdout or '')
                  print(out,end='')
                  print('TIMEOUT',to)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-instruments-probe
          path: /tmp/out
          if-no-files-found: error
