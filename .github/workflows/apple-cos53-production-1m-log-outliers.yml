name: Apple COS53 WORK smooth-switch screen

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-WORK-smooth-switching-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-work-smooth-switch-screen
  cancel-in-progress: true

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact WORK lineage and existing executors
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2daf7bd0a5a08df06efd169b1c38b55569de32f7 HEAD
          bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh build
      - name: Screen only existing WORK routes around seams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/screen.txt
          : > "$OUT"
          fast_native(){ bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate fast >/dev/null; bash benchmark_support/run_apple_cos53_hotloop_eff.sh one "$1" "$2"; }
          off_native(){ bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate off >/dev/null; bash benchmark_support/run_apple_cos53_hotloop_eff.sh one "$1" "$2"; }
          fast_wg(){ bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate fast >/dev/null; bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one "$1" "$2"; }
          fast_custom(){ /tmp/apple_cos53_cpu_pocket_attack "$1" "$2"; }
          frozen_gcd(){ /tmp/apple_cos53_off_frozen candidate "$1"; }
          apple(){ /tmp/apple_cos53_off_frozen apple "$1"; }

          for r in 1 2; do
            for n in 2000 2500 3000 3500 4000 4500 5000 6000; do
              for mode in auto adapt2 pool2; do fast_native "$mode" "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=low n=$n mode=$mode /" | tee -a "$OUT"; done
              apple "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=low n=$n mode=APPLE /" | tee -a "$OUT"
            done
            for n in 24000 27000 29000 29999 30000 32000 35000 38000 40000 40001 42000 45000 48000 50000; do
              for mode in pool2 adapt2 pool3; do fast_native "$mode" "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=mid n=$n mode=$mode /" | tee -a "$OUT"; done
              fast_wg wg3_user "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=mid n=$n mode=wg3_user /" | tee -a "$OUT"
              fast_wg wg2_ui "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=mid n=$n mode=wg2_ui /" | tee -a "$OUT"
              apple "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=mid n=$n mode=APPLE /" | tee -a "$OUT"
            done
            for n in 100000 150000 200000 250000 300000 400000 500000 600000 750000 1000000; do
              off_native pool3 "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=high n=$n mode=pool3_off /" | tee -a "$OUT"
              fast_wg wg3_utility "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=high n=$n mode=wg3_utility /" | tee -a "$OUT"
              fast_custom wg3_default_s8 "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=high n=$n mode=wg3_default_s8 /" | tee -a "$OUT"
              frozen_gcd "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=high n=$n mode=frozen_gcd /" | tee -a "$OUT"
              apple "$n" | sed "s/^/slot=${{ matrix.slot }} round=$r band=high n=$n mode=APPLE /" | tee -a "$OUT"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-work-smooth-screen-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
