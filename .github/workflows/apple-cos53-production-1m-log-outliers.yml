name: Apple COS53 REST energy telemetry probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-energy-all-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-rest-energy-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          printf '%s\n' "$changed"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Probe M1 energy telemetry
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/out
          uname -a | tee /tmp/out/system.txt
          sysctl -n machdep.cpu.brand_string | tee -a /tmp/out/system.txt
          echo '=== sudo ===' | tee /tmp/out/powermetrics.txt
          sudo -n true 2>&1 | tee -a /tmp/out/powermetrics.txt
          echo '=== help ===' | tee -a /tmp/out/powermetrics.txt
          /usr/bin/powermetrics -h 2>&1 | head -160 | tee -a /tmp/out/powermetrics.txt || true
          echo '=== cpu_power sample ===' | tee -a /tmp/out/powermetrics.txt
          sudo -n /usr/bin/powermetrics --samplers cpu_power -i 100 -n 5 2>&1 | tee -a /tmp/out/powermetrics.txt
          echo '=== relevant lines ===' | tee -a /tmp/out/powermetrics.txt
          grep -Ei 'CPU Power|Combined Power|Package|energy|power' /tmp/out/powermetrics.txt | tail -80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-rest-energy-probe
          path: /tmp/out
          if-no-files-found: error
