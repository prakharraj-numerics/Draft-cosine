name: Apple COS53 REST process-energy telemetry probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-energy-all-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-rest-process-energy-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Probe per-process energy impact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cat >/tmp/energyburn.py <<'PY'
          import math,time
          x=0.123
          end=time.time()+4
          while time.time()<end:
              for i in range(200000): x=math.cos(x+i*1e-9)
          print(x)
          PY
          python3 /tmp/energyburn.py >/tmp/out/burn.out 2>&1 &
          BURN=$!
          sleep 0.3
          sudo -n /usr/bin/powermetrics --samplers tasks --show-process-energy -r pid -i 200 -n 8 2>&1 | tee /tmp/out/process_energy.txt
          wait $BURN
          echo '=== energy lines ==='
          grep -Ei 'energy|python|PID|energyburn' /tmp/out/process_energy.txt | tail -200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-rest-process-energy-probe
          path: /tmp/out
          if-no-files-found: error
