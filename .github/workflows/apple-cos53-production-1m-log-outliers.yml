name: Apple COS53 Instruments live probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-instruments-3k-78k-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-instruments-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Record finite CPU Counters and Time Profiler probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cat >/tmp/cpuburn.py <<'PY'
          import time, math
          end=time.monotonic()+1.5
          x=0.123456789
          i=0
          while time.monotonic()<end:
              x=math.fma(x,1.0000000001,0.0000000003) if hasattr(math,'fma') else x*1.0000000001+0.0000000003
              i+=1
          print(i,x)
          PY
          python3 - <<'PY' | tee /tmp/out/live.txt
          import subprocess,os
          for template,tag in [('CPU Counters','counters'),('Time Profiler','time')]:
              out=f'/tmp/out/{tag}.trace'
              print(f'=== RECORD {template} ===',flush=True)
              cmd=['xcrun','xctrace','record','--template',template,'--time-limit','3s','--output',out,'--target-stdout','/dev/null','--no-prompt','--launch','--','/usr/bin/python3','/tmp/cpuburn.py']
              try:
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=15)
                  print(p.stdout,end=''); print('RC',p.returncode,'TRACE_EXISTS',os.path.isdir(out))
              except subprocess.TimeoutExpired as e:
                  print('RECORD_TIMEOUT',template,e.stdout or '')
              if os.path.isdir(out):
                  toc=f'/tmp/out/{tag}-toc.xml'
                  try:
                      p=subprocess.run(['xcrun','xctrace','export','--input',out,'--toc','--output',toc],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=15)
                      print('EXPORT_RC',p.returncode,p.stdout)
                      if os.path.exists(toc):
                          txt=open(toc,errors='replace').read()
                          print(f'=== TOC {tag} ===')
                          print(txt[:30000])
                  except subprocess.TimeoutExpired as e:
                      print('EXPORT_TIMEOUT',tag,e.stdout or '')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-instruments-live-probe
          path: /tmp/out
          if-no-files-found: error
