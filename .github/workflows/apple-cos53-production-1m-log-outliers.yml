name: Apple COS53 REST vs Apple Instruments 3K 78K

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-instruments-3k-78k-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-rest-instruments-3k-78k
  cancel-in-progress: true

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          test "$(git hash-object benchmark_support/run_apple_cos53_WORK_smooth_switch.sh)" = f33a3187b191c076397f433c56111b2f041dfa4a
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

      - name: Build exact REST with profiling-only repetition counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          hits=0
          for p in Path('benchmark_support').glob('*.sh'):
              s=p.read_text(); n=s.count('2000000/n')
              if n:
                  p.write_text(s.replace('2000000/n','60000000/n')); hits += n
          p=Path('benchmark_support/apple_cos53_highway_benchmark.cpp')
          s=p.read_text(); a=s.count('12000000/(n*6)')
          if a: p.write_text(s.replace('12000000/(n*6)','60000000/(n*6)'))
          print('rest_rep_patch_hits',hits,'apple_rep_patch_hits',a)
          assert hits >= 1 and a >= 1
          PY
          bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh build
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 3000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 78000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 78000)" == old_wg3_utility ]]
          # Put the same fast-contract stack that REST uses at both selected points in place.
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate fast

      - name: Record direct-route reference numbers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          : > /tmp/out/reference.txt
          run_ref() {
            who="$1"; n="$2"
            if [[ "$who" == REST && "$n" == 3000 ]]; then
              /tmp/apple_cos53_canonical_optimized_bench auto 3000
            elif [[ "$who" == REST && "$n" == 78000 ]]; then
              /tmp/apple_cos53_hotloop_apple_specific_bench wg3_utility 78000
            else
              /tmp/apple_cos53_off_frozen apple "$n"
            fi | sed "s/^/slot=${{ matrix.slot }} who=$who n=$n /" | tee -a /tmp/out/reference.txt
          }
          for n in 3000 78000; do
            if (( (${{ matrix.slot }} + n) % 2 == 0 )); then seq=(REST APPLE); else seq=(APPLE REST); fi
            for who in "${seq[@]}"; do run_ref "$who" "$n"; done
          done

      - name: Time Profiler direct executables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/out/xctrace-status.txt
          import subprocess,os
          slot=${{ matrix.slot }}
          cases=[('REST',3000),('APPLE',3000),('REST',78000),('APPLE',78000)]
          if slot % 2 == 0: cases=list(reversed(cases))
          for who,n in cases:
              tag=f'{who.lower()}_{n}'
              trace=f'/tmp/out/{tag}.trace'
              stdout=f'/tmp/out/{tag}.run.txt'
              if who=='REST' and n==3000:
                  target=['/tmp/apple_cos53_canonical_optimized_bench','auto','3000']
              elif who=='REST' and n==78000:
                  target=['/tmp/apple_cos53_hotloop_apple_specific_bench','wg3_utility','78000']
              else:
                  target=['/tmp/apple_cos53_off_frozen','apple',str(n)]
              cmd=['xcrun','xctrace','record','--template','Time Profiler','--time-limit','10s',
                   '--output',trace,'--target-stdout',stdout,'--no-prompt','--launch','--']+target
              print('RECORD',who,n,' '.join(target),flush=True)
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=25)
              print(p.stdout,end=''); print('RC',p.returncode,'trace',os.path.isdir(trace),flush=True)
              if p.returncode != 0 or not os.path.isdir(trace): raise SystemExit(f'record failed {who} {n}')
              toc=f'/tmp/out/{tag}-toc.xml'
              ep=subprocess.run(['xcrun','xctrace','export','--input',trace,'--toc','--output',toc],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
              print('TOC',tag,'rc',ep.returncode,'bytes',os.path.getsize(toc) if os.path.exists(toc) else -1)
              if ep.stdout: print(ep.stdout,end='')
              # Discover exact data-table schema names from TOC, then export the available Time Profiler table(s).
              if os.path.exists(toc):
                  txt=open(toc,errors='replace').read()
                  for schema in ('time-profile','time-sample'):
                      if f'schema="{schema}"' not in txt: continue
                      out=f'/tmp/out/{tag}-{schema}.xml'
                      xpath=f'/trace-toc/run[@number="1"]/data/table[@schema="{schema}"]'
                      xp=subprocess.run(['xcrun','xctrace','export','--input',trace,'--xpath',xpath,'--output',out],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
                      print('EXPORT',tag,schema,'rc',xp.returncode,'bytes',os.path.getsize(out) if os.path.exists(out) else -1)
                      if xp.stdout: print(xp.stdout,end='')
          PY

      - name: Capture ARM64 disassembly and hot-function summary
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/out
          {
            echo '=== 3K REST binary ==='; nm -nm /tmp/apple_cos53_canonical_optimized_bench || true
            echo '=== 78K REST binary ==='; nm -nm /tmp/apple_cos53_hotloop_apple_specific_bench || true
            echo '=== Apple wrapper ==='; nm -nm /tmp/apple_cos53_off_frozen || true
          } > /tmp/out/symbols.txt 2>&1
          otool -tvV /tmp/apple_cos53_canonical_optimized_bench > /tmp/out/rest3k-disasm.txt 2>&1 || true
          otool -tvV /tmp/apple_cos53_hotloop_apple_specific_bench > /tmp/out/rest78k-disasm.txt 2>&1 || true
          otool -tvV /tmp/apple_cos53_off_frozen > /tmp/out/apple-disasm.txt 2>&1 || true
          python3 - <<'PY' > /tmp/out/hot-function-summary.txt
          import re
          cases=[('REST_3K','/tmp/out/rest3k-disasm.txt',0x100006cd0,0x1000073bc),('REST_78K','/tmp/out/rest78k-disasm.txt',0x100004b68,0x100005690)]
          pats={'FMA':r'\b(?:fmla|fmls|fmadd|fmsub|fnmadd|fnmsub)\b','FMUL':r'\bfmul\b','LOAD':r'\b(?:ldr|ldp|ld1|ldur)\b','STORE':r'\b(?:str|stp|st1|stur)\b','FP_INT_CONV':r'\b(?:fcvt\w*|scvtf|ucvtf)\b','BRANCH':r'\b(?:b\.|b\s|bl\s|blr\s|cbz\s|cbnz\s|tbz\s|tbnz\s)'}
          for name,path,a,b in cases:
              ins=[]
              for line in open(path,errors='replace'):
                  m=re.match(r'^([0-9a-fA-F]{16})\s+(.+)$',line)
                  if m and a<=int(m.group(1),16)<b: ins.append(m.group(2).lower())
              txt='\n'.join(ins)
              mem=[x for x in ins if re.match(r'^(?:ldr|ldp|ld1|ldur|str|stp|st1|stur)\b',x)]
              print(name,'bytes',b-a,'static_instructions',len(ins),'stack_mem_ops',sum('[sp' in x for x in mem))
              for k,p in pats.items(): print(k,len(re.findall(p,txt)))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-cos53-instruments-3k-78k-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
