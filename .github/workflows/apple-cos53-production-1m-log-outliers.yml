name: Apple COS53 rusage energy probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-energy-all-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-rusage-energy-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Probe rusage_info_current energy fields
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cat >/tmp/rusage_energy_probe.cpp <<'CPP'
          #include <libproc.h>
          #include <sys/resource.h>
          #include <sys/wait.h>
          #include <unistd.h>
          #include <chrono>
          #include <cmath>
          #include <cstdio>
          #include <cstdlib>
          int main(){
            pid_t p=fork();
            if(p==0){
              volatile double x=0.123;
              auto end=std::chrono::steady_clock::now()+std::chrono::seconds(3);
              while(std::chrono::steady_clock::now()<end){
                for(int i=0;i<200000;i++) x=std::cos(x+i*1e-9);
              }
              std::_Exit((int)x);
            }
            usleep(400000);
            rusage_info_current ri{};
            int rc=proc_pid_rusage(p,RUSAGE_INFO_CURRENT,(rusage_info_t*)&ri);
            std::printf("rc=%d user_ns=%llu system_ns=%llu pkg_idle=%llu intr=%llu energy_nj=%llu penergy_nj=%llu instructions=%llu cycles=%llu pinstructions=%llu pcycles=%llu\n",
              rc,
              (unsigned long long)ri.ri_user_time,(unsigned long long)ri.ri_system_time,
              (unsigned long long)ri.ri_pkg_idle_wkups,(unsigned long long)ri.ri_interrupt_wkups,
              (unsigned long long)ri.ri_energy_nj,(unsigned long long)ri.ri_penergy_nj,
              (unsigned long long)ri.ri_instructions,(unsigned long long)ri.ri_cycles,
              (unsigned long long)ri.ri_pinstructions,(unsigned long long)ri.ri_pcycles);
            int st=0; waitpid(p,&st,0); return 0;
          }
          CPP
          clang++ -O2 -std=c++20 /tmp/rusage_energy_probe.cpp -o /tmp/rusage_energy_probe
          /tmp/rusage_energy_probe | tee /tmp/out/rusage_energy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-rusage-energy-probe
          path: /tmp/out
          if-no-files-found: error
