name: Apple COS53 final 3-way WORK vs ATTACK vs Apple M1

on:
  workflow_dispatch:
  push:
    branches:
      - verify/apple-cos53-WORK-vs-ATTACK-vs-APPLE-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-final-3way
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact WORK plus exact ATTACK wrapper only
        shell: bash
        run: |
          set -euo pipefail
          WORK=2daf7bd0a5a08df06efd169b1c38b55569de32f7
          ATTACK=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$WORK" HEAD
          git merge-base --is-ancestor "$ATTACK" HEAD
          test "$(git hash-object benchmark_support/run_apple_cos53_WORK_smooth_switch.sh)" = f33a3187b191c076397f433c56111b2f041dfa4a
          changed="$(git diff --name-only "$WORK" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/apple-cos53-production-1m-log-outliers.yml' 'benchmark_support/run_apple_cos53_WORK_smooth_switch.sh' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh build

      - name: Assert WORK and ATTACK routing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 78000)" == old_wg3_utility ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 80000)" == wg2_utility_s8 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 82000)" == old_wg2_default ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 100000)" == native_pool3_off ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 200000)" == old_wg3_utility ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 500000)" == frozen_baseline ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 1000000)" == wg3_default_s8 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 3000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 29999)" == pool2 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 30000)" == wg2_ui ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 40000)" == WORK_40K_wg3_user ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 40001)" == wg2_ui ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 78000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 200000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 500000)" == WORK ]]

      - name: Validate unchanged kernels
        if: matrix.slot == 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate fast
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh validate | tee /tmp/out/accuracy_fast.txt
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate off
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh validate | tee /tmp/out/accuracy_off.txt

      - name: Benchmark WORK vs ATTACK vs Apple M1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          : > "$OUT"
          sizes=(100 400 700 1200 3000 5000 7500 15000 29999 30000 40000 40001 50000 78000 80000 82000 100000 200000 500000 1000000)
          for r in 1 2 3; do
            for n in "${sizes[@]}"; do
              order=$(( (r + ${{ matrix.slot }} + n) % 3 ))
              if (( order == 0 )); then seq=(WORK ATTACK APPLE); elif (( order == 1 )); then seq=(ATTACK APPLE WORK); else seq=(APPLE WORK ATTACK); fi
              for who in "${seq[@]}"; do
                case "$who" in
                  WORK)
                    bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh one "$n" | sed -E 's/stack=[^ ]+/stack=WORK/' ;;
                  ATTACK)
                    bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh one "$n" | sed -E 's/stack=[^ ]+/stack=ATTACK/' ;;
                  APPLE)
                    /tmp/apple_cos53_off_frozen apple "$n" | sed -E 's/stack=[^ ]+/stack=APPLE/' ;;
                esac | sed "s/^/slot=${{ matrix.slot }} round=$r n=$n /" | tee -a "$OUT"
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-final-3way-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
