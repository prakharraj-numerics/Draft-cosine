name: Apple COS53 Instruments live probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-instruments-3k-78k-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-instruments-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Record live CPU Counters and Time Profiler probes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/out
          run_one() {
            template="$1"; tag="$2"
            echo "=== RECORD $template ===" | tee -a /tmp/out/live.txt
            python3 - "$template" "$tag" <<'PY' 2>&1 | tee -a /tmp/out/live.txt
          import subprocess,sys,os
          template,tag=sys.argv[1:]
          out=f'/tmp/out/{tag}.trace'
          cmd=['xcrun','xctrace','record','--template',template,'--time-limit','2s','--output',out,'--target-stdout','/dev/null','--no-prompt','--launch','--','/usr/bin/yes']
          try:
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=20)
              print(p.stdout,end=''); print('RC',p.returncode,'TRACE_EXISTS',os.path.exists(out))
          except subprocess.TimeoutExpired as e:
              print('TIMEOUT',e.stdout or '')
          PY
            if [[ -d "/tmp/out/${tag}.trace" ]]; then
              xcrun xctrace export --input "/tmp/out/${tag}.trace" --toc --output "/tmp/out/${tag}-toc.xml" 2>>/tmp/out/live.txt || true
              echo "=== TOC $tag ===" >> /tmp/out/live.txt
              sed -n '1,240p' "/tmp/out/${tag}-toc.xml" >> /tmp/out/live.txt 2>/dev/null || true
            fi
          }
          run_one 'CPU Counters' counters
          run_one 'Time Profiler' time
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-instruments-live-probe
          path: /tmp/out
          if-no-files-found: error
