name: Apple COS53 contract-fast p64 baseline final verify

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - 'benchmark_support/run_apple_cos53_contract_fast_baseline.sh'

concurrency:
  group: apple-cos53-contract-fast-p64-baseline-final
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prior p64 baseline and materialized contract-fast baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9ef125b86cbc996686daab5d3c7ebaa1b629e80d HEAD
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh build

      - name: Assert production routing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 77500)" == contract_fast ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 78000)" == contract_fast_p64 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 80000)" == contract_fast_p64 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 82000)" == contract_fast_p64 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 82500)" == contract_fast ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 100000)" == prior_baseline ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 500000)" == prior_baseline ]]

      - name: Validate attack accuracy
        if: matrix.slot == 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh validate | tee /tmp/out/accuracy.txt

      - name: Benchmark final baseline vs prior p64 baseline vs Apple vvcos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          echo "slot=${{ matrix.slot }} prior_baseline_sha=9ef125b86cbc996686daab5d3c7ebaa1b629e80d" > "$OUT"
          sizes=(100 400 700 1200 3000 5000 7500 15000 29999 30000 40000 40001 50000 78000 80000 82000 100000 200000 500000 1000000)

          prior_one() {
            local n="$1"
            bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate off
            bash benchmark_support/run_apple_cos53_canonical_cpu_v2_robust.sh one "$n"
          }

          final_one() {
            local n="$1"
            bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh one "$n"
          }

          apple_one() {
            local n="$1"
            /tmp/apple_cos53_off_frozen apple "$n"
          }

          for r in 0 1 2; do
            for n in "${sizes[@]}"; do
              order=$(( (r + ${{ matrix.slot }} + n) % 3 ))
              if (( order == 0 )); then seq=(final prior apple); elif (( order == 1 )); then seq=(prior apple final); else seq=(apple final prior); fi
              for who in "${seq[@]}"; do
                case "$who" in
                  final) final_one "$n" | sed -E 's/stack=[^ ]+/stack=final_contract_fast/' ;;
                  prior) prior_one "$n" | sed -E 's/stack=[^ ]+/stack=prior_p64_baseline/' ;;
                  apple) apple_one "$n" | sed -E 's/stack=[^ ]+/stack=vvcos/' ;;
                esac | sed "s/^/round=$((r+1)) n=$n /" | tee -a "$OUT"
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-contract-fast-baseline-final-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
