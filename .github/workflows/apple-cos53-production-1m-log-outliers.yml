name: Apple COS53 REST energy-related counter probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-energy-all-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-rest-energy-counter-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Probe energy-related counters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cat >/tmp/energyburn.py <<'PY'
          import math,time
          x=0.123
          end=time.time()+5
          while time.time()<end:
              for i in range(200000): x=math.cos(x+i*1e-9)
          print(x)
          PY
          python3 /tmp/energyburn.py >/tmp/out/burn.out 2>&1 &
          BURN=$!
          sleep 0.3
          set +e
          sudo -n /usr/bin/powermetrics --samplers tasks --show-process-energy --show-process-samp-norm --show-process-amp --show-process-ipc -r pid -i 250 -n 8 2>&1 | tee /tmp/out/counters.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "powermetrics_rc=$RC" | tee -a /tmp/out/counters.txt
          wait $BURN
          echo '=== relevant lines ===' | tee -a /tmp/out/counters.txt
          grep -Ei 'Name|Python|Energy Impact|Instructions|Cycles|cluster|AMP|Wakeups|Pkg idle|CPU ms/s' /tmp/out/counters.txt | tail -300 | tee /tmp/out/relevant.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-rest-energy-counter-probe
          path: /tmp/out
          if-no-files-found: error
