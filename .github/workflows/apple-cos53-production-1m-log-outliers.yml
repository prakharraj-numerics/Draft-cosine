name: Apple COS53 Instruments probe

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-instruments-3k-78k-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
      - name: Probe Instruments and counters
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/out
          {
            echo '=== SYSTEM ==='
            uname -a
            sysctl -n machdep.cpu.brand_string || true
            system_profiler SPHardwareDataType || true
            echo '=== XCODE ==='
            xcode-select -p || true
            xcodebuild -version || true
            xcrun xctrace version || true
            echo '=== TEMPLATES ==='
            xcrun xctrace list templates || true
            echo '=== DEVICES ==='
            xcrun xctrace list devices || true
            echo '=== RECORD HELP ==='
            xcrun xctrace record --help || true
            echo '=== EXPORT HELP ==='
            xcrun xctrace export --help || true
          } 2>&1 | tee /tmp/out/probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-instruments-probe
          path: /tmp/out
          if-no-files-found: error
