name: Apple COS53 hot routed vs vvcos resources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-hot-routed-vvcos-resources
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact K1280 plumbing and hot routed stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('benchmark_support/run_apple_cos53_k1280_fastreduce_vs_vvcos.sh')
          s=p.read_text()
          a=s.index("a=s.index('static int validate_mode()')")
          b=s.index("print('K1280_RETUNE'", a)
          s=s[:a]+"Path('/tmp/candidate_stress.cpp').write_text(s)\n"+s[b:]
          s=s.replace('  echo "=== stressed 1M MPFR256 diagnostic ==="\n  /tmp/apple_cos53_k1280_fastreduce_stress validate\n','')
          p.write_text(s)
          PY
          bash benchmark_support/run_apple_cos53_k1280_fastreduce_vs_vvcos.sh build
          bash benchmark_support/run_apple_cos53_cpu_eff_all_attacks.sh build
          bash benchmark_support/run_apple_cos53_apple_specific_eff.sh build
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh build

          cat >/tmp/run_hot_route.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          stack="$1"; n="$2"
          if [[ "$stack" == apple ]]; then
            exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh one apple "$n"
          fi
          case "$n" in
            100) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one single_utility "$n" ;;
            400) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg2_ui "$n" ;;
            700) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg2_utility "$n" ;;
            1200) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg2_ui "$n" ;;
            3000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg2_default "$n" ;;
            5000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg3_utility "$n" ;;
            7500) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh one auto "$n" ;;
            15000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg3_user "$n" ;;
            29999) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg3_utility "$n" ;;
            30000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh one pool3 "$n" ;;
            40000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg3_user "$n" ;;
            40001) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg2_default "$n" ;;
            50000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg2_user "$n" ;;
            100000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh one auto "$n" ;;
            200000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh one pool3 "$n" ;;
            500000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg3_default "$n" ;;
            1000000) exec bash benchmark_support/run_apple_cos53_hotloop_eff.sh apple_one wg3_ui "$n" ;;
            *) exit 3 ;;
          esac
          SH
          chmod +x /tmp/run_hot_route.sh

      - name: Validate hot kernel
        if: matrix.slot == 1
        shell: bash
        run: |
          set -euo pipefail
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh validate | tee /tmp/hot_accuracy.txt

      - name: Benchmark routed hot vs Apple wall CPU RSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          echo "slot=${{ matrix.slot }} cpu=$(sysctl -n machdep.cpu.brand_string)" > "$OUT"
          echo "candidate=hot kernel under accepted Apple-specific/hybrid route map" >> "$OUT"
          echo "logical_B_hot_common_path=32" >> "$OUT"
          echo "retired_instructions=unavailable_on_hosted_M1_PMU" >> "$OUT"
          sizes=(100 400 700 1200 3000 5000 7500 15000 29999 30000 40000 40001 50000 100000 200000 500000 1000000)
          for r in 0 1 2; do
            for n in "${sizes[@]}"; do
              if (( (r + ${{ matrix.slot }}) % 2 == 0 )); then modes=(hot apple); else modes=(apple hot); fi
              for mode in "${modes[@]}"; do
                TF=/tmp/out/time_${mode}_${n}_${r}.txt
                /usr/bin/time -l /tmp/run_hot_route.sh "$mode" "$n" > /tmp/out/stdout_${mode}_${n}_${r}.txt 2>"$TF"
                line=$(cat /tmp/out/stdout_${mode}_${n}_${r}.txt)
                maxrss=$(awk '/maximum resident set size/ {print $1}' "$TF" | tail -1)
                echo "round=$((r+1)) route=$mode $line maxrss_bytes=$maxrss" | tee -a "$OUT"
              done
            done
          done
          if [[ -f /tmp/hot_accuracy.txt ]]; then cp /tmp/hot_accuracy.txt /tmp/out/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-hot-routed-vvcos-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
