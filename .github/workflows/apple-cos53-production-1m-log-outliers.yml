name: Apple COS53 REST 79-81K hypothesis vs Apple M1

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-REST-79-81k-hypothesis-20260906
    paths:
      - '.github/workflows/apple-cos53-production-1m-log-outliers.yml'

concurrency:
  group: apple-cos53-rest-79-81k-hypothesis
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact frozen REST plus workflow only
        shell: bash
        run: |
          set -euo pipefail
          REST=925ae7aad2a8878e325f521b1dcc69d5eb443e99
          git merge-base --is-ancestor "$REST" HEAD
          changed="$(git diff --name-only "$REST" HEAD | sort)"
          test "$changed" = '.github/workflows/apple-cos53-production-1m-log-outliers.yml'
          test "$(git hash-object benchmark_support/run_apple_cos53_WORK_smooth_switch.sh)" = f33a3187b191c076397f433c56111b2f041dfa4a
          bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh build

      - name: Assert REST routes at 79K 80K 81K
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 79000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 80000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh route 81000)" == WORK ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 79000)" == frozen_baseline ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 80000)" == wg2_utility_s8 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_cpu_pockets_selected.sh route 81000)" == frozen_baseline ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 79000)" == contract_fast_p64 ]]
          [[ "$(bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh route 81000)" == contract_fast_p64 ]]

      - name: Validate unchanged REST kernels
        if: matrix.slot == 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate fast
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh validate | tee /tmp/out/accuracy_fast.txt
          bash benchmark_support/run_apple_cos53_contract_fast_baseline.sh activate off
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh validate | tee /tmp/out/accuracy_off.txt

      - name: Benchmark REST vs Apple M1 at 79K 80K 81K
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          : > "$OUT"
          sizes=(79000 80000 81000)
          for r in 1 2 3 4 5; do
            for n in "${sizes[@]}"; do
              order=$(( (r + ${{ matrix.slot }} + n) % 2 ))
              if (( order == 0 )); then seq=(REST APPLE); else seq=(APPLE REST); fi
              for who in "${seq[@]}"; do
                case "$who" in
                  REST)
                    bash benchmark_support/run_apple_cos53_WORK_smooth_switch.sh one "$n" | sed -E 's/stack=[^ ]+/stack=REST/' ;;
                  APPLE)
                    /tmp/apple_cos53_off_frozen apple "$n" | sed -E 's/stack=[^ ]+/stack=APPLE/' ;;
                esac | sed "s/^/slot=${{ matrix.slot }} round=$r n=$n /" | tee -a "$OUT"
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-rest-79-81k-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
