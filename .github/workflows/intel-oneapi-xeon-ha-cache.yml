name: Intel oneAPI Xeon HA cache

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/intel-oneapi-xeon-ha-cache.yml'

jobs:
  intel-oneapi-ha:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Base packages + Intel repo
        shell: bash
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils curl xz-utils gpg-agent wget ca-certificates
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update -qq

      - name: Restore Intel oneAPI cache
        id: oneapi-cache
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: intel-oneapi-prof3-intel-2026.1.0-236-2026.1.1-325-v1

      - name: Install Intel oneAPI compiler and MKL on cache miss
        if: steps.oneapi-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends intel-oneapi-mkl-devel intel-oneapi-compiler-dpcpp-cpp
          test -x /opt/intel/oneapi/compiler/latest/bin/icx
          test -d /opt/intel/oneapi/mkl/latest

      - name: Verify icx and oneMKL VML_HA batch cosine
        shell: bash
        run: |
          set -euo pipefail
          CC=/opt/intel/oneapi/compiler/latest/bin/icx
          MKLROOT=/opt/intel/oneapi/mkl/latest
          test -x "$CC"
          test -f "$MKLROOT/include/mkl.h"
          "$CC" --version
          cat >/tmp/check_vml_ha.c <<'EOF'
          #include <math.h>
          #include <stdio.h>
          #include <mkl.h>
          int main(void) {
              double x[8] = {0.0, 0.125, -0.25, 0.5, -0.75, 1.0, 10.0, -100.0};
              double y[8];
              vmdCos(8, x, y, VML_HA);
              for (int i = 0; i < 8; ++i) {
                  if (!isfinite(y[i])) return 2;
              }
              printf("INTEL_XEON_HA_BATCH_READY vmdCos_VML_HA=1 y0=%.17g\n", y[0]);
              return 0;
          }
          EOF
          "$CC" -O3 -xHost -fp-model=precise -I"$MKLROOT/include" /tmp/check_vml_ha.c \
            -L"$MKLROOT/lib" -Wl,-rpath,"$MKLROOT/lib" \
            -Wl,--start-group \
            -lmkl_intel_lp64 -lmkl_sequential -lmkl_core \
            -Wl,--end-group -lpthread -lm -ldl \
            -o /tmp/check_vml_ha
          /tmp/check_vml_ha
