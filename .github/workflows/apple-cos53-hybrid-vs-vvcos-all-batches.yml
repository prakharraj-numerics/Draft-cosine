name: Apple COS53 hybrid speed+CPU vs vvcos all batches

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-k1280-cpu-eff-all-attacks-20260906
    paths:
      - '.github/workflows/apple-cos53-hybrid-vs-vvcos-all-batches.yml'

concurrency:
  group: apple-cos53-hybrid-vs-vvcos-all-batches
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact frozen K1280 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('benchmark_support/run_apple_cos53_k1280_fastreduce_vs_vvcos.sh')
          s=p.read_text()
          a=s.index("a=s.index('static int validate_mode()')")
          b=s.index("print('K1280_RETUNE'", a)
          s=s[:a]+"Path('/tmp/candidate_stress.cpp').write_text(s)\n"+s[b:]
          s=s.replace('  echo "=== stressed 1M MPFR256 diagnostic ==="\n  /tmp/apple_cos53_k1280_fastreduce_stress validate\n','')
          p.write_text(s)
          PY
          bash benchmark_support/run_apple_cos53_k1280_fastreduce_vs_vvcos.sh build
          cp /tmp/apple_cos53_k1280_fastreduce_bench /tmp/apple_cos53_frozen_k1280_bench

      - name: Build optimized CPU-efficiency kernel
        shell: bash
        run: |
          set -euo pipefail
          bash benchmark_support/run_apple_cos53_cpu_eff_all_attacks.sh build

      - name: Validate optimized kernel
        if: matrix.slot == 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          bash benchmark_support/run_apple_cos53_cpu_eff_all_attacks.sh validate | tee /tmp/out/accuracy.txt

      - name: Benchmark selected hybrid against Apple vvcos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          echo "slot=${{ matrix.slot }} cpu=$(sysctl -n machdep.cpu.brand_string)" > "$OUT"
          echo "hybrid_source=all-attacks run 33995471662 selected winners" >> "$OUT"
          echo "optimized_commit=a4d3328ddff2afa1525481bb8143d7c756aecebe" >> "$OUT"
          echo "frozen_commit=ddbeb33c40d9f4913ebce3537d501c1396d6ef29" >> "$OUT"
          sizes=(100 400 700 1200 3000 5000 7500 15000 29999 30000 40000 40001 50000 100000 200000 500000 1000000)
          select_mode() {
            case "$1" in
              100) echo single ;;
              400|700|1200|500000|1000000) echo frozen ;;
              3000|7500|15000|50000|100000) echo auto ;;
              5000|29999|40001) echo adapt2 ;;
              30000|40000|200000) echo pool3 ;;
              *) return 1 ;;
            esac
          }
          for r in 0 1 2; do
            for n in "${sizes[@]}"; do
              mode="$(select_mode "$n")"
              # Alternate order each round/slot to reduce thermal/order bias.
              if (( (r + ${{ matrix.slot }}) % 2 == 0 )); then order=(hybrid apple); else order=(apple hybrid); fi
              for who in "${order[@]}"; do
                if [[ "$who" == apple ]]; then
                  /tmp/apple_cos53_frozen_k1280_bench apple "$n" \
                    | sed "s/^/round=$((r+1)) selected=$mode /" | tee -a "$OUT"
                elif [[ "$mode" == frozen ]]; then
                  /tmp/apple_cos53_frozen_k1280_bench candidate "$n" \
                    | sed "s/stack=candidate/stack=hybrid/" \
                    | sed "s/^/round=$((r+1)) selected=$mode /" | tee -a "$OUT"
                else
                  bash benchmark_support/run_apple_cos53_cpu_eff_all_attacks.sh one "$mode" "$n" \
                    | sed "s/stack=$mode/stack=hybrid/" \
                    | sed "s/^/round=$((r+1)) selected=$mode /" | tee -a "$OUT"
                fi
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-hybrid-vvcos-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
