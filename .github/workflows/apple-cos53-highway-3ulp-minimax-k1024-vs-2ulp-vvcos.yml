name: Apple COS53 Highway 3ULP minimax K1024 vs 2ULP and vvcos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-cos53-highway-3ulp-minimax-k1024-vs-2ulp-vvcos.yml'

jobs:
  benchmark:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1,2,3,4]
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Require native Apple M1
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          CPU="$(sysctl -n machdep.cpu.brand_string)"
          echo "CPU=$CPU slot=${{ matrix.slot }}"
          [[ "$CPU" == *"Apple M1"* ]]

      - name: Install dependencies and Highway 1.4.0
        shell: bash
        run: |
          set -euo pipefail
          brew list flint >/dev/null 2>&1 || brew install flint
          brew list mpfr >/dev/null 2>&1 || brew install mpfr
          brew list gmp >/dev/null 2>&1 || brew install gmp
          git clone --depth 1 --branch 1.4.0 https://github.com/google/highway.git /tmp/highway
          git -C /tmp/highway rev-parse HEAD | tee /tmp/highway_commit.txt

      - name: Stage frozen 2ULP and minimax 3ULP sources
        shell: bash
        run: |
          set -euo pipefail
          cp benchmark_support/sine_53_coeff_source.c /tmp/src2.c
          cp benchmark_support/sine_53_coeff_source.c /tmp/src3.c
          cp benchmark_support/apple_cos53_coeff_bridge.c /tmp/bridge2.c
          cp benchmark_support/apple_cos53_coeff_bridge.c /tmp/bridge3.c
          cp benchmark_support/apple_cos53_generate_constants.c /tmp/gen2.c
          cp benchmark_support/apple_cos53_generate_constants.c /tmp/gen3.c
          cp benchmark_support/apple_cos53_highway_benchmark.cpp /tmp/hwy2.cpp
          cp benchmark_support/apple_cos53_highway_benchmark.cpp /tmp/hwy3.cpp

          python3 - <<'PY'
          from pathlib import Path

          def patch_src(path, sfk, lutn):
              p=Path(path); s=p.read_text()
              s=s.replace('#define SF_K 12',f'#define SF_K {sfk}')
              s=s.replace('#define SF_LUT_N ((1UL << SF_K) + 1UL)',f'#define SF_LUT_N {lutn}UL')
              p.write_text(s)

          def patch_bridge(path, include_name):
              p=Path(path); s=p.read_text()
              s=s.replace('#include "apple_cosine53_coeff_source.c"',f'#include "{include_name}"')
              s=s.replace('s53_coeff_create_terms(2)','s53_coeff_create_terms(1)')
              s=s.replace('c->poly_deg != 5','c->poly_deg != 3')
              p.write_text(s)

          def patch_gen(path, lutn):
              p=Path(path); s=p.read_text().replace('#define LUTN 403',f'#define LUTN {lutn}')
              p.write_text(s)

          patch_src('/tmp/src2.c',11,3218)
          patch_src('/tmp/src3.c',10,1610)
          patch_bridge('/tmp/bridge2.c','src2.c')
          patch_bridge('/tmp/bridge3.c','src3.c')
          patch_gen('/tmp/gen2.c',3218)
          patch_gen('/tmp/gen3.c',1610)

          # Frozen 2ULP: degree-3 Taylor, K=2048.
          p=Path('/tmp/hwy2.cpp'); s=p.read_text()
          s=s.replace('#include "apple_cos53_constants.h"','#include "apple_cos53_constants_2ulp.h"')
          s=s.replace('static constexpr double KGRID = 256.0;','static constexpr double KGRID = 2048.0;')
          s=s.replace('static constexpr double INVK = 1.0 / 256.0;','static constexpr double INVK = 1.0 / 2048.0;')
          s=s.replace('    const auto c24v = hn::Set(d, 1.0/24.0);\n    const auto c120v = hn::Set(d, 1.0/120.0);\n','')
          old='''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n        auto c4 = hn::Mul(c0, c24v);\n        auto c5 = hn::Mul(c1, c120v);\n\n        auto p = hn::MulAdd(c5, delta, c4);\n        p = hn::MulAdd(p, delta, c3);\n        p = hn::MulAdd(p, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);'''
          new='''        auto c2 = hn::Mul(c0, mh);\n        auto c3 = hn::Mul(c1, m6);\n\n        auto p = hn::MulAdd(c3, delta, c2);\n        p = hn::MulAdd(p, delta, c1);\n        p = hn::MulAdd(p, delta, c0);'''
          assert old in s
          s=s.replace(old,new,1); p.write_text(s)

          # 3ULP minimax: same cubic runtime, K=1024.  A0/B1 are baked into LUT;
          # mh/m6 become the exactly-rounded A2/A0 and B3/B1 ratios.
          p=Path('/tmp/hwy3.cpp'); s=p.read_text()
          s=s.replace('#include "apple_cos53_constants.h"','#include "apple_cos53_constants_3ulp.h"')
          s=s.replace('static constexpr double KGRID = 256.0;','static constexpr double KGRID = 1024.0;')
          s=s.replace('static constexpr double INVK = 1.0 / 256.0;','static constexpr double INVK = 1.0 / 1024.0;')
          s=s.replace('    const auto mh = hn::Set(d, -0.5);','    const auto mh = hn::Set(d, -0x1.ffffff5555558p-2);')
          s=s.replace('    const auto m6 = hn::Set(d, -1.0/6.0);','    const auto m6 = hn::Set(d, -0x1.5555550000001p-3);')
          s=s.replace('    const auto c24v = hn::Set(d, 1.0/24.0);\n    const auto c120v = hn::Set(d, 1.0/120.0);\n','')
          assert old in s
          s=s.replace(old,new,1); p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import cosine53_apply_formula_conversion as m
          m.patch_coeff(Path('/tmp/src2.c'))
          m.patch_coeff(Path('/tmp/src3.c'))
          PY

      - name: Generate 2ULP and retuned 3ULP constants
        shell: bash
        run: |
          set -euo pipefail
          FP="$(brew --prefix flint)"; MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          CFLAGS="-O2 -DNDEBUG -I/tmp -I$FP/include -I$MP/include -I$GP/include"
          LIBS="-L$FP/lib -L$MP/lib -L$GP/lib -lflint -lmpfr -lgmp -lm"
          clang $CFLAGS /tmp/bridge2.c /tmp/gen2.c $LIBS -o /tmp/gen2
          clang $CFLAGS /tmp/bridge3.c /tmp/gen3.c $LIBS -o /tmp/gen3
          /tmp/gen2 /tmp/apple_cos53_constants_2ulp.h
          /tmp/gen3 /tmp/apple_cos53_constants_3ulp.h

          # Bake the Chebyshev/minimax A0 and B1 corrections into the K=1024 LUT.
          # Work as exact rationals of the already generated binary64 anchors, then
          # round once back to binary64. No runtime operation is added.
          python3 - <<'PY'
          from pathlib import Path
          from fractions import Fraction
          import re

          p=Path('/tmp/apple_cos53_constants_3ulp.h')
          s=p.read_text()
          h4=Fraction(1,2048**4)
          A0=Fraction(1,1)-h4/Fraction(192,1)
          B1=Fraction(1,1)-h4/Fraction(384,1)

          def scale_array(text,name,factor):
              pat=rf'(static const double {name}\[APPLE_COS53_LUTN\] = \{{\n)(.*?)(\n\}};)'
              m=re.search(pat,text,re.S)
              assert m, name
              body=m.group(2)
              def repl(mm):
                  x=float.fromhex(mm.group(0))
                  y=float(Fraction.from_float(x)*factor)
                  return y.hex()
              body=re.sub(r'-?0x[0-9a-fA-F]+(?:\.[0-9a-fA-F]*)?p[+-]?\d+',repl,body)
              return text[:m.start(2)]+body+text[m.end(2):]

          s=scale_array(s,'apple_cos53_c0',A0)
          s=scale_array(s,'apple_cos53_c1',B1)
          p.write_text(s)
          print('A0',float(A0).hex(),'B1',float(B1).hex())
          print('A2/A0',float((-Fraction(1,2)+Fraction(1,2048**2)/24)/A0).hex())
          print('B3/B1',float((-Fraction(1,6)+Fraction(1,2048**2)/96)/B1).hex())
          PY
          shasum -a 256 /tmp/apple_cos53_constants_2ulp.h /tmp/apple_cos53_constants_3ulp.h

      - name: Build candidates and validators
        shell: bash
        run: |
          set -euo pipefail
          MP="$(brew --prefix mpfr)"; GP="$(brew --prefix gmp)"
          COMMON='-O3 -DNDEBUG -std=c++20 -mcpu=native -fno-fast-math -ffp-contract=off'
          clang++ $COMMON -I/tmp -I/tmp/highway /tmp/hwy2.cpp -framework Accelerate -pthread -o /tmp/hwy2
          clang++ $COMMON -I/tmp -I/tmp/highway /tmp/hwy3.cpp -framework Accelerate -pthread -o /tmp/hwy3
          clang++ $COMMON -DAPPLE_COS53_VALIDATE_MPFR -I/tmp -I/tmp/highway -I"$MP/include" -I"$GP/include" \
            /tmp/hwy2.cpp -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/hwy2v
          clang++ $COMMON -DAPPLE_COS53_VALIDATE_MPFR -I/tmp -I/tmp/highway -I"$MP/include" -I"$GP/include" \
            /tmp/hwy3.cpp -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/hwy3v

          cat > /tmp/zero_stress.cpp <<'CPP'
          #define APPLE_COS53_VALIDATE_MPFR
          #define main embedded_candidate_main
          #include "/tmp/hwy3.cpp"
          #undef main
          int main(){
            const int Q=3183, R=8, N=(Q+1)*(2*R+1);
            std::vector<double> x; x.reserve(N);
            mpfr_t pi,z; mpfr_init2(pi,256); mpfr_init2(z,256); mpfr_const_pi(pi,MPFR_RNDN);
            for(int q=0;q<=Q;q++){
              mpfr_set_ui(z,(unsigned long)(2*q+1),MPFR_RNDN);
              mpfr_mul(z,z,pi,MPFR_RNDN); mpfr_div_2ui(z,z,1,MPFR_RNDN);
              double c=mpfr_get_d(z,MPFR_RNDN);
              double v=c;
              for(int k=0;k<R;k++) v=std::nextafter(v,-INFINITY);
              for(int k=-R;k<=R;k++){ x.push_back(v); v=std::nextafter(v,INFINITY); }
            }
            std::vector<double> y(x.size()); cos53_eval_hwy(x.data(),y.data(),x.size());
            uint64_t mx=0; size_t le3=0; mpfr_t a,r; mpfr_init2(a,256); mpfr_init2(r,256);
            for(size_t i=0;i<x.size();i++){
              mpfr_set_d(a,x[i],MPFR_RNDN); mpfr_cos(r,a,MPFR_RNDN); double ref=mpfr_get_d(r,MPFR_RNDN);
              uint64_t u=ulpd(y[i],ref); if(u>mx)mx=u; if(u<=3)le3++;
            }
            printf("APPLE_COS53_3ULP_ZERO_STRESS cases=%zu le3=%zu maxulp=%llu\n",x.size(),le3,(unsigned long long)mx);
            mpfr_clear(r); mpfr_clear(a); mpfr_clear(z); mpfr_clear(pi); return mx<=3?0:9;
          }
          CPP
          clang++ $COMMON -I/tmp -I/tmp/highway -I"$MP/include" -I"$GP/include" /tmp/zero_stress.cpp \
            -framework Accelerate -pthread -L"$MP/lib" -L"$GP/lib" -lmpfr -lgmp -o /tmp/zero_stress

      - name: Validate accuracy before timing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          /tmp/hwy2v validate | tee /tmp/out/accuracy_2ulp.txt
          /tmp/hwy3v validate | tee /tmp/out/accuracy_3ulp.txt
          /tmp/zero_stress | tee /tmp/out/zero_stress.txt
          M="$(sed -n 's/.*hwy_maxulp=\([0-9][0-9]*\).*/\1/p' /tmp/out/accuracy_3ulp.txt | tail -1)"
          test -n "$M" && test "$M" -le 3

      - name: Benchmark frozen 2ULP vs 3ULP minimax vs vvcos
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/out/results.txt
          echo "APPLE_ENV cpu=$(sysctl -n machdep.cpu.brand_string) arch=$(uname -m) os=$(sw_vers -productVersion) helper=AppleTwoCore highway=1.4.0 frozen2=degree3_K2048 candidate3=degree3_minimax_K1024_LUTN1610 comparator=vvcos" | tee "$OUT"
          sizes=(100 400 1200 3000 5000 20000 50000 200000)
          for n in "${sizes[@]}"; do
            case $((n%3)) in
              0) order=(apple two three);;
              1) order=(two three apple);;
              2) order=(three apple two);;
            esac
            for s in "${order[@]}"; do
              case "$s" in
                apple) /tmp/hwy3 apple "$n" | sed 's/stack=apple/stack=vvcos/' | tee -a "$OUT";;
                two) /tmp/hwy2 hwy2 "$n" | sed 's/stack=hwy2/stack=highway_2ulp/' | tee -a "$OUT";;
                three) /tmp/hwy3 hwy2 "$n" | sed 's/stack=hwy2/stack=highway_3ulp_minimax/' | tee -a "$OUT";;
              esac
            done
          done
          printf 'degree=3\ngrid=1024\nsf_k=10\nlutn=1610\nmax_ulp_gate=3\nA0=0x1.ffffffffffffdp-1\nB1=0x1.fffffffffffffp-1\nA2_over_A0=-0x1.ffffff5555558p-2\nB3_over_B1=-0x1.5555550000001p-3\n' > /tmp/out/config_3ulp.txt
          cp /tmp/highway_commit.txt /tmp/out/highway_commit.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-highway-3ulp-minimax-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
