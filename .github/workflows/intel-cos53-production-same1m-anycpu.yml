name: Intel COS53 production same 1M any CPU

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/intel-cos53-production-same1m-anycpu.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLINT_PREFIX: /home/runner/flint36
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CPU info
        run: lscpu
      - name: Require AVX-512
        run: grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgmp-dev libmpfr-dev curl xz-utils gpg-agent wget ca-certificates
      - name: Restore Intel oneAPI
        id: oneapi
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: intel-oneapi-prof3-intel-2026.1.0-236-2026.1.1-325-v1
      - name: Install Intel oneAPI on cache miss
        if: steps.oneapi.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends intel-oneapi-mkl-devel intel-oneapi-compiler-dpcpp-cpp
      - name: Restore FLINT 3.6.0
        id: flint
        uses: actions/cache@v4
        with:
          path: /home/runner/flint36
          key: flint-3.6.0-ubuntu24-x86_64-native-cd49f6116fb977da331dbb6627f4998397730a62253bd7a70a201ad5a00576d7-v2
      - name: Install FLINT on cache miss
        if: steps.flint.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 -o /tmp/flint.tar.xz https://github.com/flintlib/flint/releases/download/v3.6.0/flint-3.6.0.tar.xz
          tar -xf /tmp/flint.tar.xz -C /tmp
          cd /tmp/flint-3.6.0
          CFLAGS='-O3 -march=native -DNDEBUG' ./configure --prefix="$FLINT_PREFIX"
          make -j2 >/dev/null
          make install >/dev/null
      - name: Validate frozen Intel production on exact same 1M inputs
        run: bash benchmark_support/run_intel_cos53_production_same1m_xeon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: intel-cos53-production-same1m-anycpu
          path: /tmp/intel_cos53_same1m_result.txt
          if-no-files-found: error
