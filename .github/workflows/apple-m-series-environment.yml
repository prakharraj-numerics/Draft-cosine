name: Apple M-series environment check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-m-series-environment.yml'

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify native Apple silicon environment
        shell: bash
        run: |
          set -euo pipefail
          echo '=== uname ==='
          uname -a
          ARCH="$(uname -m)"
          echo "ARCH=$ARCH"
          echo '=== CPU ==='
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.physicalcpu || true
          sysctl -n hw.logicalcpu || true
          system_profiler SPHardwareDataType || true
          echo '=== compiler ==='
          clang --version
          clang++ --version
          if [[ "$ARCH" != "arm64" ]]; then
            echo "Expected native Apple silicon arm64 runner, got $ARCH" >&2
            exit 2
          fi

      - name: Verify Accelerate framework
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/accelerate_probe.c <<'C'
          #include <Accelerate/Accelerate.h>
          int main(void) { return 0; }
          C
          clang -O2 /tmp/accelerate_probe.c -framework Accelerate -o /tmp/accelerate_probe
          /tmp/accelerate_probe
          echo 'ACCELERATE_AVAILABLE=1'

      - name: Record environment
        shell: bash
        run: |
          {
            echo "arch=$(uname -m)"
            echo "cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
            echo "physical=$(sysctl -n hw.physicalcpu 2>/dev/null || true)"
            echo "logical=$(sysctl -n hw.logicalcpu 2>/dev/null || true)"
            echo "os=$(sw_vers -productVersion)"
            echo "clang=$(clang --version | head -1)"
          } | tee apple_m_series_environment.txt

      - name: Upload environment report
        uses: actions/upload-artifact@v4
        with:
          name: apple-m-series-environment
          path: apple_m_series_environment.txt
