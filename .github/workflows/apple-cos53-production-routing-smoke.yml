name: Apple COS53 production routing smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apple_cos53_production_routing.hpp'
      - 'APPLE_COS53_PRODUCTION_ROUTING.md'
      - '.github/workflows/apple-cos53-production-routing-smoke.yml'
jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen routing boundaries
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pthreadpool.h <<'H'
          #pragma once
          #include <cstddef>
          #include <cstdint>
          typedef struct pthreadpool* pthreadpool_t;
          typedef void (*pthreadpool_task_1d_t)(void*, std::size_t);
          static inline pthreadpool_t pthreadpool_create(std::size_t) { return (pthreadpool_t)1; }
          static inline void pthreadpool_destroy(pthreadpool_t) {}
          static inline void pthreadpool_parallelize_1d(pthreadpool_t,
                                                        pthreadpool_task_1d_t fn,
                                                        void* ctx,
                                                        std::size_t range,
                                                        std::uint32_t) {
            for (std::size_t i = 0; i < range; ++i) fn(ctx, i);
          }
          H
          cat > /tmp/HalideRuntime.h <<'H'
          #pragma once
          #include <cstdint>
          typedef int (*halide_task_t)(void*, int, std::uint8_t*);
          static inline int halide_set_num_threads(int) { return 0; }
          static inline int halide_do_par_for(void* user_context,
                                              halide_task_t task,
                                              int min,
                                              int size,
                                              std::uint8_t* closure) {
            for (int i = 0; i < size; ++i) {
              const int rc = task(user_context, min + i, closure);
              if (rc != 0) return rc;
            }
            return 0;
          }
          H
          cat > /tmp/smoke.cpp <<'CPP'
          #include <cstddef>
          struct AppleTwoCoreHighway { void run(const double*, double*, std::size_t) {} };
          static inline void cos53_eval_hwy(const double*, double*, std::size_t) {}
          #include "apple_cos53_production_routing.hpp"
          int main() {
            using apple_cos53_production::frozen_piece_count;
            using apple_cos53_production::use_pthreadpool;
            using apple_cos53_production::use_halide;
            return !(
              !use_pthreadpool(0) &&
              !use_pthreadpool(4999) &&
               use_pthreadpool(5000) &&
               use_pthreadpool(29999) &&
              !use_pthreadpool(30000) &&
              !use_halide(29999) &&
               use_halide(30000) &&
               use_halide(40000) &&
              !use_halide(40001) &&
              frozen_piece_count(29999) == 0 &&
              frozen_piece_count(30000) == 32 &&
              frozen_piece_count(49999) == 32 &&
              frozen_piece_count(50000) == 16 &&
              frozen_piece_count(99999) == 16 &&
              frozen_piece_count(100000) == 12 &&
              frozen_piece_count(999999) == 12 &&
              frozen_piece_count(1000000) == 24 &&
              frozen_piece_count(2000000) == 24
            );
          }
          CPP
          clang++ -std=c++20 -O2 -I/tmp -I. /tmp/smoke.cpp -o /tmp/smoke
          /tmp/smoke
