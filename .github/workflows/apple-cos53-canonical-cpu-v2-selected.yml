name: Apple COS53 canonical CPU v2 selected

on:
  workflow_dispatch:
  push:
    branches:
      - exp/apple-cos53-canonical-cpu-v2-20260906
    paths:
      - '.github/workflows/apple-cos53-canonical-cpu-v2-selected.yml'

concurrency:
  group: apple-cos53-canonical-cpu-v2-selected
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical baseline and selected CPU-v2 route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('benchmark_support/run_apple_cos53_k1280_fastreduce_vs_vvcos.sh')
          s=p.read_text()
          a=s.index("a=s.index('static int validate_mode()')")
          b=s.index("print('K1280_RETUNE'", a)
          s=s[:a]+"Path('/tmp/candidate_stress.cpp').write_text(s)\n"+s[b:]
          s=s.replace('  echo "=== stressed 1M MPFR256 diagnostic ==="\n  /tmp/apple_cos53_k1280_fastreduce_stress validate\n','')
          p.write_text(s)
          PY
          bash benchmark_support/run_apple_cos53_k1280_fastreduce_vs_vvcos.sh build
          cp /tmp/apple_cos53_k1280_fastreduce_bench /tmp/apple_cos53_canonical_frozen_bench
          bash benchmark_support/run_apple_cos53_cpu_eff_all_attacks.sh build
          cp /tmp/apple_cos53_cpu_eff_bench /tmp/apple_cos53_canonical_optimized_bench
          bash benchmark_support/run_apple_cos53_apple_specific_eff.sh build
          bash benchmark_support/run_apple_cos53_hotloop_eff.sh build

      - name: Validate selected kernel
        if: matrix.slot == 1
        shell: bash
        run: |
          mkdir -p /tmp/out
          bash benchmark_support/run_apple_cos53_canonical_cpu_v2_selected.sh validate | tee /tmp/out/accuracy.txt

      - name: Benchmark selected vs canonical vs Apple
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          OUT=/tmp/out/results.txt
          echo "slot=${{ matrix.slot }} canonical_sha=14c74c60c3d2507033c49fff10382ccc11c308e1 selected_source_commit=0ef6f20019b654bb37e57ccef4248f16aa4cc128" > "$OUT"
          sizes=(100 400 700 1200 3000 5000 7500 15000 29999 30000 40000 40001 50000 100000 200000 500000 1000000)
          canonical_mode() {
            case "$1" in
              100) echo single ;;
              400|700|1200|500000|1000000) echo frozen ;;
              3000|7500|15000|50000|100000) echo auto ;;
              5000|29999|40001) echo adapt2 ;;
              30000|40000|200000) echo pool3 ;;
            esac
          }
          run_canonical() {
            local n="$1" m="$2"
            if [[ "$m" == frozen ]]; then
              /tmp/apple_cos53_canonical_frozen_bench candidate "$n" | sed 's/stack=candidate/stack=canonical/'
            else
              /tmp/apple_cos53_canonical_optimized_bench "$m" "$n" | sed "s/stack=$m/stack=canonical/"
            fi
          }
          for r in 0 1 2; do
            for n in "${sizes[@]}"; do
              cm="$(canonical_mode "$n")"
              sel=$(( (r + ${{ matrix.slot }}) % 3 ))
              if (( sel == 0 )); then order=(selected canonical apple)
              elif (( sel == 1 )); then order=(canonical apple selected)
              else order=(apple selected canonical)
              fi
              for who in "${order[@]}"; do
                case "$who" in
                  selected)
                    bash benchmark_support/run_apple_cos53_canonical_cpu_v2_selected.sh one "$n" \
                      | sed -E 's/stack=[^ ]+/stack=selected/' \
                      | sed "s/^/round=$((r+1)) n=$n /" | tee -a "$OUT" ;;
                  canonical)
                    run_canonical "$n" "$cm" \
                      | sed "s/^/round=$((r+1)) n=$n /" | tee -a "$OUT" ;;
                  apple)
                    /tmp/apple_cos53_canonical_frozen_bench apple "$n" \
                      | sed 's/stack=apple/stack=vvcos/' \
                      | sed "s/^/round=$((r+1)) n=$n /" | tee -a "$OUT" ;;
                esac
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-canonical-cpu-v2-selected-${{ matrix.slot }}
          path: /tmp/out
          if-no-files-found: error
