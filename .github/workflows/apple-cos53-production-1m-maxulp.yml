name: Apple COS53 production 1M max ULP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-cos53-production-1m-maxulp.yml'
      - 'benchmark_support/run_apple_cos53_1m_maxulp.sh'

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exactly one 1M batch against MPFR256
        shell: bash
        run: bash benchmark_support/run_apple_cos53_1m_maxulp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apple-cos53-production-1m-maxulp
          path: /tmp/result.txt
          if-no-files-found: error
